id: ts-b-release-notes-g3-edge
agentId: release-notes
group: g3-edge
name: 发布说明生成 · 边界情况：空 / 超短 / 超长 / 极端参数
description: 单条/超短/超长标题、150 条提交、版本全空、v999.999.999 等极端参数下的稳定产出（离线确定性模式）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g3-edge-1
    title: 边界输入：单条超短提交
    tags:
      - release
    repeat: 5
    input:
      kind: text
      goal: 边界输入也要产出结构完整的发布说明
      content: 单条超短提交
      files:
        - path: input/commits.txt
          content: x
      params:
        from: v1.0.0
        to: HEAD
        version: ""
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 发布说明
          weight: 2
          note: 产出标准发布说明
        - type: contains
          text: "## 贡献者与统计"
          weight: 1
        - type: contains
          text: 发布说明
          weight: 2
          note: 边界输入下确定性结论正确
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 250
          weight: 1
      requiredSuggestions: []
  - id: g3-edge-2
    title: 边界输入：单字符类型
    tags:
      - release
    repeat: 5
    input:
      kind: text
      goal: 边界输入也要产出结构完整的发布说明
      content: 单字符类型
      files:
        - path: input/commits.txt
          content: "a: b"
      params:
        from: v1.0.0
        to: HEAD
        version: ""
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 发布说明
          weight: 2
          note: 产出标准发布说明
        - type: contains
          text: "## 贡献者与统计"
          weight: 1
        - type: contains
          text: "## 其他"
          weight: 2
          note: 边界输入下确定性结论正确
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 250
          weight: 1
      requiredSuggestions: []
  - id: g3-edge-3
    title: 边界输入：只有类型没有描述
    tags:
      - release
    repeat: 5
    input:
      kind: text
      goal: 边界输入也要产出结构完整的发布说明
      content: 只有类型没有描述
      files:
        - path: input/commits.txt
          content: "feat:"
      params:
        from: v1.0.0
        to: HEAD
        version: ""
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 发布说明
          weight: 2
          note: 产出标准发布说明
        - type: contains
          text: "## 贡献者与统计"
          weight: 1
        - type: contains
          text: "## 其他"
          weight: 2
          note: 边界输入下确定性结论正确
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 250
          weight: 1
      requiredSuggestions: []
