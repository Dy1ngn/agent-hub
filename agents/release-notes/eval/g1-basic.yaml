id: ts-b-release-notes-g1-basic
agentId: release-notes
group: g1-basic
name: 发布说明生成 · 基础功能：典型提交列表的发布说明
description: 功能/修复/破坏性/文档/性能/重构/非常规/依赖等典型提交组合，走「解析分组 + semver 推断 + 模型润色」完整链路（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-basic-1
    title: 发布说明样本 1
    tags:
      - release
    repeat: 10
    input:
      kind: text
      goal: 解析提交列表并生成分组发布说明（可选模型润色）
      content: 为这批提交生成发布说明。
      files:
        - path: input/commits.txt
          content: "feat(auth): 增加登录失败重试限制

            fix(auth): 修复空指针导致的登录崩溃

            feat(ui): 新增深色模式开关

            fix(pay): 修复重复扣款问题

            docs: 更新部署文档\n"
      params:
        from: v1.0.0
        to: HEAD
        version: ""
    gold:
      findings: []
      checks:
        - type: contains
          text: 发布说明
          weight: 2
          note: 产出标准发布说明
        - type: contains
          text: "## 贡献者与统计"
          weight: 1
        - type: contains
          text: "## 新功能"
          weight: 2
          note: 确定性分组正确
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
