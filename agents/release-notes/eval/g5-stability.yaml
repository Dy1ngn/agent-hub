id: ts-b-release-notes-g5-stability
agentId: release-notes
group: g5-stability
name: 发布说明生成 · 稳定性：同输入重复调用
description: 10 个样本各重复调用 10 次（离线确定性模式），验证解析分组、semver 推断与统计稳定一致（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性重复：样本 1
    tags:
      - release
    repeat: 10
    input:
      kind: text
      goal: 重复调用验证分组与统计稳定
      content: 稳定性样本 1
      files:
        - path: input/commits.txt
          content: "feat(auth): 增加登录失败重试限制

            fix(auth): 修复空指针导致的登录崩溃

            feat(ui): 新增深色模式开关

            fix(pay): 修复重复扣款问题

            docs: 更新部署文档\n"
      params:
        from: v1.0.0
        to: HEAD
        version: ""
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 发布说明
          weight: 2
          note: 产出标准发布说明
        - type: contains
          text: "## 贡献者与统计"
          weight: 1
        - type: contains
          text: "## 新功能"
          weight: 2
          note: 确定性分组稳定
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 250
          weight: 1
      requiredSuggestions: []
