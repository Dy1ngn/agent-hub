id: ts-b-release-notes-g2-variation
agentId: release-notes
group: g2-variation
name: 发布说明生成 · 输入变体：规模 / 形态 / 版本参数
description: 1~50 条提交、多 scope、大小写类型、显式版本/版本告警/semver 级别等参数变体（模型链路）（35 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g2-scale-1
    title: 单条提交 · 起点 v1.0.0
    tags:
      - release
    repeat: 2
    input:
      kind: text
      goal: 不同规模/形态提交列表 × 不同起始版本
      content: 单条提交（起始版本 v1.0.0）
      files:
        - path: input/commits.txt
          content: "feat: 新增导出功能"
      params:
        from: v1.0.0
        to: HEAD
        version: ""
    gold:
      findings: []
      checks:
        - type: contains
          text: 发布说明
          weight: 2
          note: 产出标准发布说明
        - type: contains
          text: "## 贡献者与统计"
          weight: 1
        - type: contains
          text: "## 亮点"
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
