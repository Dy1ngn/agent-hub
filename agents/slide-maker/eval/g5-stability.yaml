id: ts-b-slide-maker-g5-stability
agentId: slide-maker
group: g5-stability
name: 幻灯片生成 · 稳定性：同输入重复调用
description: 10 个样本各重复 10 次（离线排版模式），验证输出稳定、页数与页脚一致、不崩溃（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性重复：迁移方案
    tags:
      - stability
      - offline
    repeat: 10
    input:
      kind: text
      goal: 重复调用验证输出稳定
      content: 稳定性样本 1：迁移方案
      files:
        - path: input/doc.md
          content: "# 云平台迁移方案


            ## 背景


            - 机房租赁合同明年 3 月到期

            - 现有集群运维成本高


            ## 迁移方案


            - 采用分批迁移策略，先无状态服务

            - 数据库使用 DTS 双写校验

            - 迁移窗口安排在凌晨低峰期


            ## 风险与应对


            - 回滚预案：保留旧集群两周

            - 演练：正式迁移前全链路演练 2 次\n"
      params:
        offline: true
        topic: 迁移方案
        slides: "8"
        audience: 通用听众
    gold:
      findings: []
      checks:
        - type: contains
          text: "marp: true"
          weight: 2
        - type: contains
          text: 迁移方案
          weight: 2
          note: 主题页脚确定性一致
        - type: contains
          text: Q&A
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 2
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
