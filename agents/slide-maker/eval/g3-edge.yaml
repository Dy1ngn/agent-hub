id: ts-b-slide-maker-g3-edge
agentId: slide-maker
group: g3-edge
name: 幻灯片生成 · 边界情况：空 / 极短 / 极多 / 极端页数
description: 空文档、空主题、50 要点拆页、单行超长、页数上下限等边界输入下的稳定产出（离线排版模式）（10 条用例 / 100 次调用）
