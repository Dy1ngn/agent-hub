      kind: text
      goal: 边界输入也要产出合法 Marp，不允许崩溃
      content: 边界用例：空文档 + 给定主题
      files:
        - path: input/doc.md
          content: ""
      params:
        offline: true
        topic: 空文档测试
        slides: "8"
        audience: 通用听众
    gold:
      findings: []
      checks:
        - type: contains
          text: "marp: true"
          weight: 2
          note: 边界输入仍产出合法 Marp
        - type: contains
          text: 目录
          weight: 1
          note: 离线模式固定结构：目录页
        - type: contains
          text: Q&A
          weight: 1
          note: 离线模式固定结构：Q&A 页
        - type: not_contains
          text: Traceback
          weight: 2
        - type: min_length
          value: 300
          weight: 1
