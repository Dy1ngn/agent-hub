        - path: input/doc.md
          content: "# 项目复盘：秒杀活动


            ## 目标达成


            - 目标 GMV 500 万，实际完成 620 万

            - 订单峰值 8000 TPS


            ## 做得好的


            - 缓存预热提前 2 小时完成

            - 限流策略保护了核心链路


            ## 待改进


            - 库存扣减出现 30 单超卖

            - 监控告警阈值设置不合理


            ## 行动项


            - 下周完成库存扣减重构

            - 补充压测用例 20 个\n"
