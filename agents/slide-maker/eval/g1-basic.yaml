id: ts-b-slide-maker-g1-basic
agentId: slide-maker
group: g1-basic
name: 幻灯片生成 · 基础功能：主题 / 文档生成 Marp 幻灯片
description: 典型主题与文档输入下的完整链路：提炼大纲、排版成 Marp（封面/目录/内容/小结/Q&A），走模型生成内容链路（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-topic-1
    title: 按主题生成（季度业务汇报）
    tags:
      - basic
      - topic
    repeat: 5
    input:
      kind: text
      goal: 给主题直接生成 Marp 幻灯片
      content: 请围绕主题「季度业务汇报」生成幻灯片，听众：管理层。
      files:
        - path: input/doc.md
          content: ""
      params:
        topic: 季度业务汇报
        slides: "8"
        audience: 管理层
    gold:
      findings: []
      checks:
        - type: contains
          text: "marp: true"
          weight: 2
          note: 合法 Marp 头部
        - type: contains
          text: 季度业务汇报
          weight: 2
          note: 主题写进页脚
        - type: contains
          text: 第 1/
          weight: 1
          note: 页码页脚
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 400
          weight: 1
      requiredSuggestions: []
