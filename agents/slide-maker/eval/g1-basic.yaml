  - id: g1-doc-1
    title: 文档提炼生成（云平台迁移方案）
    tags:
      - basic
      - doc
    repeat: 5
    input:
      kind: text
      goal: 从现有文档提炼大纲生成 Marp 幻灯片
      content: 请把 input/doc.md 提炼成「云平台迁移方案」幻灯片，听众：技术委员会。
      files:
        - path: input/doc.md
          content: "# 云平台迁移方案


            ## 背景


            - 机房租赁合同明年 3 月到期

            - 现有集群运维成本高


            ## 迁移方案


            - 采用分批迁移策略，先无状态服务

            - 数据库使用 DTS 双写校验

            - 迁移窗口安排在凌晨低峰期


            ## 风险与应对


            - 回滚预案：保留旧集群两周

            - 演练：正式迁移前全链路演练 2 次\n"
      params:
        topic: 云平台迁移方案
        slides: "8"
        audience: 技术委员会
    gold:
      findings: []
      checks:
        - type: contains
          text: "marp: true"
          weight: 2
        - type: contains
          text: 云平台迁移方案
          weight: 2
        - type: contains
          text: 第 1/
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 400
          weight: 1
      requiredSuggestions: []
  - id: g1-doc-2
    title: 文档提炼生成（Kubernetes 教程）
    tags:
      - basic
      - doc
    repeat: 5
    input:
      kind: text
      goal: 从现有文档提炼大纲生成 Marp 幻灯片
      content: 请把 input/doc.md 提炼成「Kubernetes 教程」幻灯片，听众：开发同学。
      files:
        - path: input/doc.md
          content: "# Kubernetes 上手教程


            ## 安装准备


            - 准备 3 台 4C8G 虚拟机

            - 安装 containerd 与 kubeadm


            ## 集群搭建


            - kubeadm init 初始化控制面

            - 加入 worker 节点

            - 安装 Calico 网络插件


            ## 应用部署


            - 编写 Deployment 与 Service

            - 配置探针与资源限额

            - 用 Helm 管理发布\n"
      params:
        topic: Kubernetes 教程
        slides: "8"
        audience: 开发同学
    gold:
      findings: []
      checks:
        - type: contains
          text: "marp: true"
          weight: 2
        - type: contains
          text: Kubernetes 教程
          weight: 2
        - type: contains
          text: 第 1/
          weight: 1
        - type: not_contains
