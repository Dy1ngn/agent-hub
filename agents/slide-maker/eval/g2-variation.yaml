  - id: g2-doc-2
    title: 文档形态变体（长段落）
    tags:
      - variation
      - doc
    repeat: 5
    input:
      kind: text
      goal: 不同形态文档都能提炼出大纲并排版
      content: 请把 input/doc.md（长段落）生成「段落型文档」幻灯片。
      files:
        - path: input/doc.md
          content: "# 城市数字化转型报告


            ## 趋势


            城市数字化转型正在从单点系统建设走向全域协同。数据要素的价值被重新定义，公共数据授权运营成为新的话题。治理能力成为决定成败的关键因素，需要在制度、技术和组织三个层面同步推进。


            ## 挑战


            部门墙导致数据共享困难，标准不统一让系统集成成本居高不下。市民感知度低，很多项目建成即闲置。需要以用促建，围绕高频场景打磨亮点。\n"
      params:
        topic: 段落型文档
        slides: "8"
        audience: 通用听众
    gold:
      findings: []
      checks:
        - type: contains
          text: "marp: true"
          weight: 2
        - type: contains
          text: 段落型文档
          weight: 2
        - type: contains
          text: 第 1/
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 400
          weight: 1
      requiredSuggestions: []
