id: ts-b-slide-maker-g4-robust
agentId: slide-maker
group: g4-robust
name: 幻灯片生成 · 鲁棒性：乱码 / 控制字符 / 畸形 Markdown
description: 乱码、控制字符、零宽字符、未闭合围栏、NUL 字符等异常输入下优雅处理不崩溃（离线排版模式）（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g4-robust-1
    title: 异常输入：乱码文档
    tags:
      - robust
      - offline
    repeat: 10
    input:
      kind: text
      goal: 异常输入不能让工具崩溃，仍要输出合法 Marp
      content: 异常用例：乱码文档
      files:
        - path: input/doc.md
          content: "# ��文档�\n\n## 背景�\n\n- ��内容乱码�\n"
      params:
        offline: true
        topic: 乱码测试
        slides: "8"
        audience: 通用听众
    gold:
      findings: []
      checks:
        - type: contains
          text: "marp: true"
          weight: 2
          note: 异常输入仍产出合法 Marp
        - type: contains
          text: Q&A
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 2
        - type: not_contains
          text: SyntaxError
          weight: 1
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
