id: ts-b-file-butler-g5-stability
agentId: file-butler
group: g5-stability
name: 本地文件管家 · 稳定性：同输入重复调用
description: 10 个样本各重复 10 次（模型链路），验证同一命令重复执行都能完成任务、不崩溃（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性重复：样本 1
    tags:
      - stability
    repeat: 10
    input:
      kind: text
      goal: 重复调用验证稳定完成任务
      content: 稳定性样本 1：列出文件清单并统计数量，写入 report.md。
      files:
        - path: files/会议纪要.md
          content: "# 项目周会纪要\n\n- 时间：周一上午\n- 结论：下周完成联调\n"
        - path: files/周报.md
          content: "# 第 41 周周报\n\n- 完成接口开发\n- 修复 5 个缺陷\n"
        - path: files/.pad3
          content: ""
      params:
        cmd: 列出文件清单并统计数量，写入 report.md。
    gold:
      findings: []
      checks:
        - type: not_contains
          text: Traceback
          weight: 2
        - type: min_length
          value: 30
          weight: 2
        - type: contains
          text: 会议纪要.md
          weight: 1
          note: 结果覆盖真实文件
        - type: regex
          pattern: (?i)(report|写入|清单|汇总|统计|总结|文件)
          weight: 2
      requiredSuggestions: []
