id: ts-b-file-butler-g4-robust
agentId: file-butler
group: g4-robust
name: 本地文件管家 · 鲁棒性：乱码 / 无效命令 / 越权与缺文件
description: 乱码内容、乱码命令、无关命令、越权路径、不存在文件等异常输入下优雅处理不崩溃（模型链路）（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g4-robust-1
    title: 异常输入：文件内容乱码
    tags:
      - robust
    repeat: 10
    input:
      kind: text
      goal: 异常输入不能让工具崩溃，优雅处理即可
      content: 异常用例：文件内容乱码
      files:
        - path: files/mojibake.txt
          content: "���乱码文件��\n"
        - path: files/正常.md
          content: "# 正常\n"
      params:
        cmd: 总结每个文件的内容要点，写入 report.md。
    gold:
      findings: []
      checks:
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: min_length
          value: 20
          weight: 2
        - type: regex
          pattern: (?i)(report|文件|写入|完成|清单|统计|总结|说明|无法|拒绝|抱歉)
          weight: 2
      requiredSuggestions: []
