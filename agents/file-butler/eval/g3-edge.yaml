id: ts-b-file-butler-g3-edge
agentId: file-butler
group: g3-edge
name: 本地文件管家 · 边界情况：空文件夹 / 极多 / 特殊文件名
description: 空文件夹、12 个文件、超长文件、空文件、带空格/重音/子目录/隐藏文件的文件夹下的稳定执行（模型链路）（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g3-edge-1
    title: 边界输入：空文件夹
    tags:
      - edge
    repeat: 10
    input:
      kind: text
      goal: 边界文件夹也要完成命令，不允许崩溃
      content: 边界用例：空文件夹
      files:
        - path: files/.keep
          content: ""
        - path: files/.pad2
          content: ""
        - path: files/.pad3
          content: ""
        - path: files/.pad4
          content: ""
        - path: files/.pad5
          content: ""
        - path: files/.pad6
          content: ""
        - path: files/.pad7
          content: ""
        - path: files/.pad8
          content: ""
        - path: files/.pad9
          content: ""
        - path: files/.pad10
          content: ""
        - path: files/.pad11
          content: ""
        - path: files/.pad12
          content: ""
      params:
        cmd: 列出所有文件并写入 report.md；如果文件夹是空的，就说明这一点。
    gold:
      findings: []
      checks:
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: min_length
          value: 20
          weight: 2
        - type: regex
          pattern: (?i)(report|文件|写入|清单|统计|空|完成)
          weight: 2
        - type: contains
          text: 文件夹
          weight: 1
          note: 结果覆盖真实文件/场景
      requiredSuggestions: []
  - id: g3-edge-2
    title: 边界输入：单文件文件夹
    tags:
      - edge
    repeat: 10
    input:
      kind: text
      goal: 边界文件夹也要完成命令，不允许崩溃
      content: 边界用例：单文件文件夹
      files:
        - path: files/only.md
          content: "# 唯一文件\n\n- 内容一\n"
        - path: files/.pad2
          content: ""
        - path: files/.pad3
          content: ""
        - path: files/.pad4
          content: ""
        - path: files/.pad5
          content: ""
        - path: files/.pad6
          content: ""
        - path: files/.pad7
          content: ""
        - path: files/.pad8
          content: ""
        - path: files/.pad9
          content: ""
        - path: files/.pad10
          content: ""
        - path: files/.pad11
          content: ""
        - path: files/.pad12
          content: ""
      params:
        cmd: 列出所有文件并写一份清单到 report.md。
    gold:
      findings: []
      checks:
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: min_length
          value: 20
          weight: 2
        - type: regex
          pattern: (?i)(report|文件|写入|清单|统计|空|完成)
          weight: 2
        - type: contains
          text: only.md
          weight: 1
          note: 结果覆盖真实文件/场景
      requiredSuggestions: []
  - id: g3-edge-3
    title: 边界输入：12 个文件
    tags:
      - edge
    repeat: 10
    input:
      kind: text
      goal: 边界文件夹也要完成命令，不允许崩溃
      content: 边界用例：12 个文件
      files:
        - path: files/f01.md
          content: "# 文件 1\n\n- 内容\n"
        - path: files/f02.md
          content: "# 文件 2\n\n- 内容\n"
        - path: files/f03.md
          content: "# 文件 3\n\n- 内容\n"
        - path: files/f04.md
          content: "# 文件 4\n\n- 内容\n"
        - path: files/f05.md
          content: "# 文件 5\n\n- 内容\n"
        - path: files/f06.md
          content: "# 文件 6\n\n- 内容\n"
        - path: files/f07.md
          content: "# 文件 7\n\n- 内容\n"
        - path: files/f08.md
          content: "# 文件 8\n\n- 内容\n"
        - path: files/f09.md
          content: "# 文件 9\n\n- 内容\n"
        - path: files/f10.md
          content: "# 文件 10\n\n- 内容\n"
        - path: files/f11.md
          content: "# 文件 11\n\n- 内容\n"
        - path: files/f12.md
          content: "# 文件 12\n\n- 内容\n"
      params:
        cmd: 清点所有文件，把清单写入 report.md，每行一个文件名。
    gold:
      findings: []
      checks:
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: min_length
          value: 20
          weight: 2
        - type: regex
          pattern: (?i)(report|文件|写入|清单|统计|空|完成)
          weight: 2
        - type: contains
          text: f01.md
          weight: 1
          note: 结果覆盖真实文件/场景
      requiredSuggestions: []
