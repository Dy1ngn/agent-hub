id: ts-b-file-butler-g1-basic
agentId: file-butler
group: g1-basic
name: 本地文件管家 · 基础功能：列目录 / 提标题 / 搜索 / 统计 / 摘要
description: 典型文件夹与自然语言命令下的完整 function-call 链路：列目录、读文件、搜内容、写 report.md（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-list-1
    title: 目录清单（会议纪要.md 等）
    tags:
      - basic
      - list
    repeat: 5
    input:
      kind: text
      goal: 列出授权文件夹里的所有文件并生成清单文件
      content: 列出这个文件夹里的所有文件，每个文件一行注明文件名和大小，把清单写入 report.md。
      files:
        - path: files/会议纪要.md
          content: "# 项目周会纪要\n\n- 时间：周一上午\n- 结论：下周完成联调\n"
        - path: files/周报.md
          content: "# 第 41 周周报\n\n- 完成接口开发\n- 修复 5 个缺陷\n"
        - path: files/备忘.txt
          content: "备忘：周五前提交报销单。\n"
      params:
        cmd: 列出这个文件夹里的所有文件，每个文件一行注明文件名和大小，把清单写入 report.md。
    gold:
      findings: []
      checks:
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: min_length
          value: 30
          weight: 2
        - type: contains
          text: 会议纪要.md
          weight: 1
          note: 清单里出现真实文件名
        - type: regex
          pattern: (?i)(report|清单|列表|文件)
          weight: 1
      requiredSuggestions: []
