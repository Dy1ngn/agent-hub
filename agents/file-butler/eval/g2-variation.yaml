      files:
        - path: files/会议纪要.md
          content: "# 项目周会纪要\n\n- 时间：周一上午\n- 结论：下周完成联调\n"
        - path: files/周报.md
          content: "# 第 41 周周报\n\n- 完成接口开发\n- 修复 5 个缺陷\n"
        - path: files/备忘.txt
          content: "备忘：周五前提交报销单。\n"
        - path: files/.pad4
          content: ""
        - path: files/.pad5
          content: ""
        - path: files/.pad6
          content: ""
        - path: files/.pad7
          content: ""
        - path: files/.pad8
          content: ""
      params:
        cmd: 把文件夹里的文件整理成清单写入 report.md，每个文件注明文件名与所在目录。
    gold:
      findings: []
      checks:
        - type: not_contains
          text: Traceback
          weight: 2
        - type: min_length
          value: 30
          weight: 2
        - type: contains
          text: 会议纪要.md
          weight: 1
          note: 清单覆盖真实文件
        - type: regex
          pattern: (?i)(report|清单|文件)
