      content: 总结每个文件的内容要点，写入 report.md，并列出文件名。
      files:
        - path: files/tiny.txt
          content: "好\n"
        - path: files/.pad2
          content: ""
        - path: files/.pad3
          content: ""
      params:
        cmd: 总结每个文件的内容要点，写入 report.md，并列出文件名。
    gold:
      findings: []
      checks:
        - type: not_contains
          text: Traceback
          weight: 2
        - type: min_length
          value: 30
          weight: 2
        - type: contains
          text: tiny.txt
          weight: 1
        - type: regex
          pattern: (?i)(report|总结|要点|文件)
          weight: 1
      requiredSuggestions: []
