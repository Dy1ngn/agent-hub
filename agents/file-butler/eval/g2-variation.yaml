id: ts-b-file-butler-g2-variation
agentId: file-butler
group: g2-variation
name: 本地文件管家 · 输入变体：文件夹形态 / 大小 / 语言 / 命令措辞
description: 不同文件夹形态、文件大小、内容语言与命令措辞下的稳定执行（function-call 链路）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g2-layout-1
    title: 文件夹形态变体（单文件）
    tags:
      - variation
      - layout
    repeat: 5
    input:
      kind: text
      goal: 不同文件夹形态都能生成文件清单
      content: 把文件夹里的文件整理成清单写入 report.md，每个文件注明文件名与所在目录。
      files:
        - path: files/说明.md
          content: "# 项目说明


            这是一个示例项目。


            ## 安装


            - pip install demo\n"
        - path: files/.pad2
          content: ""
        - path: files/.pad3
          content: ""
        - path: files/.pad4
          content: ""
        - path: files/.pad5
          content: ""
        - path: files/.pad6
          content: ""
        - path: files/.pad7
          content: ""
        - path: files/.pad8
          content: ""
      params:
        cmd: 把文件夹里的文件整理成清单写入 report.md，每个文件注明文件名与所在目录。
    gold:
      findings: []
      checks:
        - type: not_contains
          text: Traceback
          weight: 2
        - type: min_length
          value: 30
          weight: 2
        - type: contains
          text: 说明.md
          weight: 1
          note: 清单覆盖真实文件
        - type: regex
          pattern: (?i)(report|清单|文件)
          weight: 1
      requiredSuggestions: []
  - id: g2-layout-2
    title: 文件夹形态变体（三个文件）
    tags:
      - variation
      - layout
    repeat: 5
    input:
      kind: text
      goal: 不同文件夹形态都能生成文件清单
