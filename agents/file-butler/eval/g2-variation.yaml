          content: "# 课程笔记\n\n- 第一讲：统计学基础\n- 第二讲：回归分析\n"
        - path: files/.pad3
          content: ""
        - path: files/.pad4
          content: ""
        - path: files/.pad5
          content: ""
        - path: files/.pad6
          content: ""
        - path: files/.pad7
          content: ""
        - path: files/.pad8
          content: ""
      params:
        cmd: 把文件夹里的文件（含子目录）整理成清单写入 report.md，注明文件名与所在目录。
    gold:
      findings: []
      checks:
        - type: not_contains
          text: Traceback
          weight: 2
        - type: min_length
          value: 30
          weight: 2
        - type: contains
          text: notes/说明.md
          weight: 1
          note: 清单覆盖真实文件
        - type: regex
          pattern: (?i)(report|清单|文件)
          weight: 1
      requiredSuggestions: []
