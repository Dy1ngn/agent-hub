      requiredSuggestions: []
  - id: g2-layout-3
    title: 文件夹形态变体（八个文件）
    tags:
      - variation
      - layout
    repeat: 5
    input:
      kind: text
      goal: 不同文件夹形态都能生成文件清单
      content: 把文件夹里的文件整理成清单写入 report.md，每个文件注明文件名与所在目录。
      files:
        - path: files/a.md
          content: "# 项目周会纪要\n\n- 时间：周一上午\n- 结论：下周完成联调\n"
        - path: files/b.md
          content: "# 第 41 周周报\n\n- 完成接口开发\n- 修复 5 个缺陷\n"
        - path: files/c.md
          content: "# 流程说明\n\n- 需求评审流程\n- 发布审批流程\n"
        - path: files/d.txt
          content: "备忘：周五前提交报销单。\n"
        - path: files/e.txt
          content: "TODO：补单元测试。\n"
        - path: files/f.md
          content: "# 学习计划\n\n- 每天两小时\n- 周末做练习\n"
        - path: files/g.md
          content: "# 课程笔记\n\n- 第一讲：统计学基础\n- 第二讲：回归分析\n"
        - path: files/h.txt
          content: "书单：\n- 深度学习\n- 统计学习方法\n"
      params:
        cmd: 把文件夹里的文件整理成清单写入 report.md，每个文件注明文件名与所在目录。
    gold:
      findings: []
      checks:
        - type: not_contains
          text: Traceback
          weight: 2
        - type: min_length
          value: 30
          weight: 2
        - type: contains
          text: a.md
          weight: 1
          note: 清单覆盖真实文件
        - type: regex
          pattern: (?i)(report|清单|文件)
          weight: 1
      requiredSuggestions: []
