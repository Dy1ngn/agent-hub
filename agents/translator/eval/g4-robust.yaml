id: ts-b-translator-g4-robust
agentId: translator
group: g4-robust
name: 多语言翻译 · 鲁棒性：畸形 / 乱码 / 编码异常输入
description: 乱码、控制字符、畸形 JSON/CSV 等异常输入下不崩溃、优雅降级（离线确定性模式）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g4-robust-1
    title: 异常输入：mojibake 乱码
    tags:
      - robust
      - offline
    repeat: 5
    input:
      kind: text
      goal: 异常输入不能让工具崩溃
      content: 翻译任务：input/doc.txt → 英语
      files:
        - path: input/doc.txt
          content: "鐑傛嵁鏂囨。閿欒緶銆傝繖鏄حاض涔辩爜銆傛嵁鏂囨。閿欒緶銆傛嵁鏂囨。\n"
        - path: input/glossary.json
          content: '{"数据库": "Database", "接口": "API", "负载均衡": "Load Balancer"}'
      params:
        file: input/doc.txt
        to: 英语
        from: 中文
        batch: "6000"
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 翻译报告
          weight: 2
          note: 异常输入仍产出翻译报告
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: min_length
          value: 150
          weight: 1
      requiredSuggestions: []
