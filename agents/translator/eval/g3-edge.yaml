id: ts-b-translator-g3-edge
agentId: translator
group: g3-edge
name: 多语言翻译 · 边界情况：空 / 超短 / 超长 / 极端参数
description: 空文件、极短文本与极端参数组合下的稳定产出（离线确定性模式：译文保留原文 + 术语表替换）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g3-edge-1
    title: 边界输入：空文件
    tags:
      - edge
      - offline
    repeat: 5
    input:
      kind: text
      goal: 边界输入也要产出翻译报告
      content: 翻译任务：input/doc.txt → 英语
      files:
        - path: input/doc.txt
          content: ""
        - path: input/glossary.json
          content: '{"数据库": "Database", "接口": "API", "负载均衡": "Load Balancer"}'
      params:
        file: input/doc.txt
        to: 英语
        from: 中文
        batch: "6000"
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 翻译报告
          weight: 2
          note: 边界输入仍产出翻译报告
        - type: contains
          text: 统计概览
          weight: 1
          note: 确定性章节仍存在
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 150
          weight: 1
      requiredSuggestions: []
