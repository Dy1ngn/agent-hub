id: ts-b-translator-g5-stability
agentId: translator
group: g5-stability
name: 多语言翻译 · 稳定性：同输入重复调用
description: 10 个样本各重复调用 10 次（离线确定性模式），验证输出稳定、不崩溃、结构一致（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性重复：样本 1
    tags:
      - stability
      - offline
    repeat: 10
    input:
      kind: text
      goal: 重复调用验证翻译输出稳定
      content: 翻译任务：input/doc.md → 英语
      files:
        - path: input/doc.md
          content: "# 接入指南\n\n通过 接口 查询数据，数据库 连接串在配置文件中。\n"
        - path: input/glossary.json
          content: '{"数据库": "Database", "接口": "API", "负载均衡": "Load Balancer"}'
      params:
        file: input/doc.md
        to: 英语
        from: 中文
        batch: "6000"
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 翻译报告
          weight: 2
        - type: contains
          text: 文件清单
          weight: 1
        - type: contains
          text: 术语表：3 条
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 2
        - type: min_length
          value: 200
          weight: 1
      requiredSuggestions: []
