id: ts-b-translator-g2-variation
agentId: translator
group: g2-variation
name: 多语言翻译 · 输入变体：格式 / 语言对 / 规模 / 参数组合
description: 不同文件格式（md/json/csv/txt）、语言对、文本规模与 batch-chars 参数下的翻译表现（模型链路）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g2-format-1
    title: 文件格式变体（note.md）
    tags:
      - variation
      - format
    repeat: 5
    input:
      kind: text
      goal: 不同格式的文件都要正常翻译并记录在报告里
      content: 翻译任务：input/note.md → 英语
      files:
        - path: input/note.md
          content: "# 便签\n\n明天上午十点开会，讨论季度计划。\n"
        - path: input/glossary.json
          content: '{"数据库": "Database", "接口": "API", "负载均衡": "Load Balancer"}'
      params:
        file: input/note.md
        to: 英语
        from: 中文
        batch: "6000"
    gold:
      findings: []
      checks:
        - type: contains
          text: 翻译报告
          weight: 1
        - type: contains
          text: "`note.md`"
          weight: 2
          note: 文件清单记录输入文件名
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 200
          weight: 1
      requiredSuggestions: []
