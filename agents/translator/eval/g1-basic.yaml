id: ts-b-translator-g1-basic
agentId: translator
group: g1-basic
name: 多语言翻译 · 基础功能：典型多语言翻译
description: 典型文档（技术文档/产品说明/邮件/表格等）的完整翻译链路（占位符保护 + 术语表 + 模型翻译），产出翻译报告（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-tech-md
    title: 技术文档中译英（input/api-guide.md）
    tags:
      - basic
      - markdown
    repeat: 5
    input:
      kind: text
      goal: 把技术文档翻译成目标语言，代码块保持不译
      content: 翻译任务：input/api-guide.md → 英语
      files:
        - path: input/api-guide.md
          content: "# 接入指南


            本服务通过 接口 对外提供数据查询能力，数据库 连接串在配置文件中管理。


            调用示例：


            ```bash

            curl https://api.example.com/v1/query

            ```


            注意：接口 有速率限制，请做好重试。\n"
        - path: input/glossary.json
          content: '{"数据库": "Database", "接口": "API", "负载均衡": "Load Balancer"}'
      params:
        file: input/api-guide.md
        to: 英语
        from: 中文
        batch: "6000"
    gold:
      findings: []
      checks:
        - type: contains
          text: 翻译报告
          weight: 1
          note: 产出标准翻译报告
        - type: contains
          text: 目标语言：英语
          weight: 2
          note: 报告元信息记录目标语言
        - type: contains
          text: 术语表：3 条
          weight: 1
          note: 术语表被加载
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 200
          weight: 1
      requiredSuggestions: []
