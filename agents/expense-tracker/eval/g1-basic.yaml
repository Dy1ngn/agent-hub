id: ts-b-expense-tracker-g1-basic
agentId: expense-tracker
group: g1-basic
name: 记账分析 · 基础功能：自然语言记账与月报
description: 典型记账行/账本/预算输入，走完整「解析 + 统计 + 模型解读」链路（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-food-1
    title: 餐饮记账（2026-10）
    tags:
      - basic
      - food
    repeat: 5
    input:
      kind: text
      goal: 从自然语言记账行生成餐饮月报
      content: 请生成 2026-10 月报。
      files:
        - path: input/expenses.txt
          content: "2026-10-05 午饭 35 元 食堂

            2026-10-06 晚饭 42 元 面馆

            2026-10-07 咖啡 18 元 星巴克\n"
        - path: input/book.json
          content: '{"version": 1, "entries": []}'
        - path: input/budget.csv
          content: "category,limit

            餐饮,100

            交通,200

            购物,300\n"
      params:
        month: 2026-10
    gold:
      findings: []
      checks:
        - type: contains
          text: 星巴克
          weight: 2
          note: 商户/摘要回显在明细里
        - type: regex
          pattern: 记账笔数 \| 3 笔
          weight: 2
          note: 笔数统计正确
        - type: regex
          pattern: 总支出 \| \d+\.\d{2} 元
          weight: 1
        - type: contains
          text: "# 开销报告（2026-10）"
          weight: 2
          note: 报告固定标题
        - type: contains
          text: "## 明细"
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 500
          weight: 1
      requiredSuggestions: []
