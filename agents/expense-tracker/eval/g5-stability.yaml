id: ts-b-expense-tracker-g5-stability
agentId: expense-tracker
group: g5-stability
name: 记账分析 · 稳定性：10 样本 × 重复 10 次
description: 10 个确定性记账样本各重复 10 次，离线输出必须完全一致（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性样本（星巴克）
    tags:
      - stability
      - offline
    repeat: 10
    input:
      kind: text
      goal: 同输入重复运行，输出应完全一致
      content: 请生成月报。
      files:
        - path: input/expenses.txt
          content: "2026-10-05 午饭 35 元 食堂

            2026-10-06 晚饭 42 元 面馆

            2026-10-07 咖啡 18 元 星巴克\n"
        - path: input/book.json
          content: '{"version": 1, "entries": []}'
        - path: input/budget.csv
          content: "category,limit

            餐饮,100

            交通,200

            购物,300\n"
      params:
        month: 2026-10
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: "# 开销报告（2026-10）"
          weight: 1
        - type: contains
          text: 星巴克
          weight: 2
          note: 商户回显
        - type: regex
          pattern: 记账笔数 \| 3 笔
          weight: 2
          note: 笔数统计正确
        - type: contains
          text: "## 明细"
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 400
          weight: 1
      requiredSuggestions: []
