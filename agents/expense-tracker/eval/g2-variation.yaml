id: ts-b-expense-tracker-g2-variation
agentId: expense-tracker
group: g2-variation
name: 记账分析 · 输入变体：笔数 / 写法 / 预算 / 月份参数
description: 记账笔数、书写风格、预算表与月份参数变体，走模型链路（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g2-volume-1
    title: 笔数变体（1 笔）
    tags:
      - variation
      - volume
    repeat: 5
    input:
      kind: text
      goal: 不同记账笔数的月报
      content: 请生成月报。
      files:
        - path: input/expenses.txt
          content: "2026-10-05 午饭 35 元 食堂\n"
        - path: input/book.json
          content: '{"version": 1, "entries": []}'
        - path: input/budget.csv
          content: "category,limit

            餐饮,100

            交通,200

            购物,300\n"
      params:
        month: 2026-10
    gold:
      findings: []
      checks:
        - type: contains
          text: 食堂
          weight: 2
        - type: regex
          pattern: 记账笔数 \| 1 笔
          weight: 2
        - type: contains
          text: "# 开销报告（2026-10）"
          weight: 2
          note: 报告固定标题
        - type: contains
          text: "## 明细"
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 500
          weight: 1
      requiredSuggestions: []
