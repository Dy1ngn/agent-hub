id: ts-b-expense-tracker-g3-edge
agentId: expense-tracker
group: g3-edge
name: 记账分析 · 边界情况：单笔 / 零元 / 极端数值
description: 单笔、零元、极大金额、重复行去重、月末日期等边界输入，离线确定性输出（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g3-minimal-1
    title: 极小记账（食堂）
    tags:
      - edge
      - offline
    repeat: 5
    input:
      kind: text
      goal: 极小输入也要优雅出月报
      content: 请生成月报。
      files:
        - path: input/expenses.txt
          content: "2026-10-05 午饭 35 元 食堂\n"
        - path: input/book.json
          content: '{"version": 1, "entries": []}'
        - path: input/budget.csv
          content: "category,limit

            餐饮,100

            交通,200

            购物,300\n"
      params:
        month: 2026-10
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 食堂
          weight: 2
        - type: contains
          text: "## 本月概览"
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 400
          weight: 1
      requiredSuggestions: []
