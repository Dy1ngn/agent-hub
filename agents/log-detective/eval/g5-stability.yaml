id: ts-b-log-detective-g5-stability
agentId: log-detective
group: g5-stability
name: 日志排查 · 稳定性：同输入重复调用
description: 10 个确定性统计样本各重复调用 10 次（离线模式），断言计数与签名聚合稳定一致（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性重复：级别分布计数
    tags:
      - stability
      - offline
    repeat: 10
    input:
      kind: log
      goal: 同一输入重复调用 10 次，确定性统计应稳定一致
      content: 请分析日志，给出错误聚合、时间分布与排查建议。
      files:
        - path: input/app.log
          content: "2026-10-28 10:00:01 ERROR one

            2026-10-28 10:00:02 ERROR two

            2026-10-28 10:00:03 ERROR three

            2026-10-28 10:00:04 WARN four

            2026-10-28 10:00:05 WARN five\n"
        - path: input/worker.log
          content: ""
      params:
        log1: input/app.log
        log2: input/worker.log
        top: "15"
        since: ""
        until: ""
        grep: ""
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 日志排查报告
          weight: 2
          note: 重复调用仍产出报告
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: regex
          pattern: 级别分布
          weight: 2
          note: 统计结论稳定出现
        - type: contains
          text: "| ERROR | 3 |"
          weight: 2
          note: 断言确定性细节
        - type: min_length
          value: 300
          weight: 1
          note: 报告不是空壳
      requiredSuggestions: []
