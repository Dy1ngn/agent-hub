id: ts-b-log-detective-g3-edge
agentId: log-detective
group: g3-edge
name: 日志排查 · 边界情况：空 / 单行 / 极值
description: 空文件、单行、2000 行、超长行、未来时间戳、同一错误 100 次等边界输入下的稳定产出（离线统计）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g3-edge-1
    title: 边界输入：双空文件
    tags:
      - edge
      - offline
    repeat: 5
    input:
      kind: log
      goal: 边界输入也要产出可读报告，不允许崩溃
      content: 请分析日志，给出错误聚合、时间分布与排查建议。
      files:
        - path: input/app.log
          content: ""
        - path: input/worker.log
          content: ""
      params:
        log1: input/app.log
        log2: input/worker.log
        top: "15"
        since: ""
        until: ""
        grep: ""
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 日志排查报告
          weight: 2
          note: 边界输入仍产出报告
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: regex
          pattern: 没有识别到错误/告警签名|Top 错误签名
          weight: 2
          note: 边界统计结果符合预期
        - type: min_length
          value: 150
          weight: 1
          note: 报告不是空壳
      requiredSuggestions: []
  - id: g3-edge-2
    title: 边界输入：单行日志
    tags:
      - edge
      - offline
    repeat: 5
