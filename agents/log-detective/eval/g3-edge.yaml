        - path: input/worker.log
          content: ""
      params:
        log1: input/app.log
        log2: input/worker.log
        top: "15"
        since: ""
        until: ""
        grep: ""
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 日志排查报告
