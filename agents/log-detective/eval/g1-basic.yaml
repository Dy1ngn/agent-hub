id: ts-b-log-detective-g1-basic
agentId: log-detective
group: g1-basic
name: 日志排查 · 基础功能：典型日志排查
description: Python/Java/nginx/JSON/ISO8601 等典型日志的错误聚合、级别分布、爆发时段与跨文件时间线（模型分析链路）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-python-1
    title: Python 日志错误聚合（标准 Python logging）
    tags:
      - basic
      - format
    repeat: 5
    input:
      kind: log
      goal: 聚合 Python 日志里的错误签名
      content: 请分析日志，给出错误聚合、时间分布与排查建议。
      files:
        - path: input/app.log
          content: "2026-10-28 10:00:01 ERROR db connection failed for user 42

            2026-10-28 10:00:02 WARN slow query 120ms

            2026-10-28 10:00:03 ERROR db connection failed for user 43

            2026-10-28 10:00:04 INFO job done\n"
        - path: input/worker.log
          content: "2026-10-28 10:00:05 ERROR timeout after 30s\n"
      params:
        log1: input/app.log
        log2: input/worker.log
        top: "15"
        since: ""
        until: ""
        grep: ""
    gold:
      findings: []
      checks:
        - type: contains
          text: 日志排查报告
          weight: 1
          note: 产出标准排查报告
        - type: contains
          text: "## 一、概览"
          weight: 1
          note: 报告固定结构（概览小节）
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: min_length
          value: 300
          weight: 1
          note: 报告不是空壳
        - type: regex
          pattern: (connection failed|payment gateway refused|Top 错误签名)
          weight: 2
          note: 识别错误签名
        - type: regex
          pattern: (级别分布|ERROR)
          weight: 1
          note: 给出级别分布
      requiredSuggestions: []
