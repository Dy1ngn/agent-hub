id: ts-b-log-detective-g4-robust
agentId: log-detective
group: g4-robust
name: 日志排查 · 鲁棒性：畸形日志与非法参数
description: 乱码、NUL、控制字符、非法时间戳、坏 JSON 行、非法参数、文件缺失等异常输入下优雅处理不崩溃（离线统计）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g4-robust-1
    title: 异常输入：乱码内容
    tags:
      - robust
      - offline
    repeat: 5
    input:
      kind: log
      goal: 异常输入不能让工具崩溃：要么正常统计，要么优雅报错
      content: 请分析日志，给出错误聚合、时间分布与排查建议。
      files:
        - path: input/app.log
          content: "鲤鲦鲪 garbage 锟斤拷\n"
        - path: input/worker.log
          content: ""
      params:
        log1: input/app.log
        log2: input/worker.log
        top: "15"
        since: ""
        until: ""
        grep: ""
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 日志排查报告
          weight: 2
          note: 异常输入仍产出报告
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: regex
          pattern: 概览|输入文件
          weight: 2
          note: 优雅处理结果符合预期
        - type: min_length
          value: 60
          weight: 1
          note: 报告不是空壳
      requiredSuggestions: []
