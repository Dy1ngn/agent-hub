id: ts-b-test-generator-g3-edge
agentId: test-generator
group: g3-edge
name: 单元测试生成 · 边界情况：空 / 超短 / 超长 / 极端参数
description: 空文件、单字符、纯注释、超多函数/参数、超长单行、极端框架/覆盖参数等边界输入下的稳定产出（离线确定性模式）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g3-edge-1
    title: 边界输入：空文件
    tags:
      - testgen
    repeat: 5
    input:
      kind: code
      goal: 边界输入也要产出结构完整的测试计划报告
      content: 边界用例：空文件
      files:
        - path: input/empty.py
          content: ""
      params:
        src: input/empty.py
        framework: pytest
        coverage: 公开函数
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 单元测试生成报告
          weight: 2
          note: 产出标准测试计划报告
        - type: contains
          text: "## 用例清单"
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 200
          weight: 1
      requiredSuggestions: []
