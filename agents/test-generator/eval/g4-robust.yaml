id: ts-b-test-generator-g4-robust
agentId: test-generator
group: g4-robust
name: 单元测试生成 · 鲁棒性：畸形 / 乱码 / 缺字段
description: 语法损坏、乱码、控制字符、NUL、混缩进等异常文件与正常文件混放：坏的跳过、好的照常分析，不崩溃（离线确定性模式）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g4-robust-1
    title: 异常输入：语法损坏
    tags:
      - testgen
    repeat: 5
    input:
      kind: code
      goal: 畸形/乱码输入不能让工具崩溃；坏文件被跳过、好文件照常分析
      content: 异常用例：语法损坏
      files:
        - path: input/bad1.py
          content: "def broken(:\n    pass\n@@@ ###\n"
        - path: input/good1.py
          content: "def keep_ok(x):\n    return x + 1\n"
      params:
        src: input
        framework: pytest
        coverage: 全部
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 单元测试生成报告
          weight: 2
          note: 异常输入仍产出报告
        - type: contains
          text: keep_ok
          weight: 1
          note: 好文件照常分析
        - type: contains
          text: 跳过
          weight: 2
          note: 坏文件被优雅跳过（或照常分析）
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: min_length
          value: 200
          weight: 1
      requiredSuggestions: []
