cases:
  - id: g2-variant-1
    title: billing.py · pytest / 公开函数
    tags:
      - testgen
    repeat: 5
    input:
      kind: code
      goal: 不同框架、覆盖范围与代码形态下的测试生成
      content: 变体样本 1：billing.py（pytest / 公开函数）
      files:
        - path: input/billing.py
          content: "\"\"\"账单计算模块。\"\"\"


            class BillError(Exception):

            \    pass



            def total(items, tax_rate):

            \    \"\"\"计算含税总价。


            \    Args:

            \        items: 条目列表

            \        tax_rate: 税率

            \    Returns:

            \        含税总价

            \    Raises:

            \        BillError: 条目为空时抛出

            \    \"\"\"

            \    if not items:

            \        raise BillError(\"empty\")

            \    return sum(items) * (1 + tax_rate)



            def apply_coupon(amount, code):

            \    if code == \"SAVE10\":

            \        return amount * 0.9

            \    return amount\n"
      params:
        src: input/billing.py
        framework: pytest
        coverage: 公开函数
    gold:
      findings: []
      checks:
        - type: contains
          text: 单元测试生成报告
          weight: 2
          note: 产出标准测试计划报告
        - type: contains
          text: "## 用例清单"
          weight: 1
        - type: contains
          text: "## 覆盖率计划"
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
