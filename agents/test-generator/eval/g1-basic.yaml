id: ts-b-test-generator-g1-basic
agentId: test-generator
group: g1-basic
name: 单元测试生成 · 基础功能：典型模块的测试生成
description: 函数/类/异步/生成器/异常契约等典型被测代码，走「ast 分析 + 用例规划 + 骨架生成 + 模型补全断言」完整链路（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-basic-1
    title: 为 billing.py 生成单元测试（apply_coupon）
    tags:
      - testgen
    repeat: 10
    input:
      kind: code
      goal: 分析被测模块并生成 pytest 测试骨架与用例清单
      content: 请为 input/ 下的被测代码生成单元测试骨架与测试计划报告。
      files:
        - path: input/billing.py
          content: "\"\"\"账单计算模块。\"\"\"


            class BillError(Exception):

            \    pass



            def total(items, tax_rate):

            \    \"\"\"计算含税总价。


            \    Args:

            \        items: 条目列表

            \        tax_rate: 税率

            \    Returns:

            \        含税总价

            \    Raises:

            \        BillError: 条目为空时抛出

            \    \"\"\"

            \    if not items:

            \        raise BillError(\"empty\")

            \    return sum(items) * (1 + tax_rate)



            def apply_coupon(amount, code):

            \    if code == \"SAVE10\":

            \        return amount * 0.9

            \    return amount\n"
      params:
        src: input/billing.py
        framework: pytest
        coverage: 公开函数
    gold:
      findings: []
      checks:
        - type: contains
          text: 单元测试生成报告
          weight: 2
          note: 产出标准测试计划报告
        - type: contains
          text: "## 用例清单"
          weight: 1
        - type: contains
          text: apply_coupon
          weight: 2
          note: 被测对象确定性出现在报告里
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
