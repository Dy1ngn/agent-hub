      files:
        - path: input/mathx.py
          content: "def gcd(a, b):

            \    \"\"\"最大公约数。\"\"\"

            \    while b:

            \        a, b = b, a % b

            \    return a



            def lcm(a, b):

            \    return a * b // gcd(a, b)



            def clamp(value, low, high):

            \    return max(low, min(high, value))\n"
      params:
