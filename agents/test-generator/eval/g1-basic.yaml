  - id: g1-basic-4
    title: 为 cache.py 生成单元测试（Cache）
    tags:
      - testgen
    repeat: 10
    input:
      kind: code
      goal: 分析被测模块并生成 pytest 测试骨架与用例清单
      content: 请为 input/ 下的被测代码生成单元测试骨架与测试计划报告。
      files:
        - path: input/cache.py
          content: "class Cache:

            \    \"\"\"带容量限制的缓存。\"\"\"


            \    def __init__(self, capacity=128):

            \        self.capacity = capacity

            \        self.data = {}


            \    def get(self, key):

            \        return self.data.get(key)


            \    def put(self, key, value):

            \        if len(self.data) >= self.capacity:

            \            self.data.pop(next(iter(self.data)))

            \        self.data[key] = value


            \    def __len__(self):

            \        return len(self.data)\n"
      params:
        src: input/cache.py
        framework: pytest
        coverage: 公开函数
