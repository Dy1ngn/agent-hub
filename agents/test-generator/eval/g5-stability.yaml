id: ts-b-test-generator-g5-stability
agentId: test-generator
group: g5-stability
name: 单元测试生成 · 稳定性：同输入重复调用
description: 10 个样本各重复调用 10 次（离线确定性模式），验证用例清单与骨架稳定一致（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性重复：样本 1
    tags:
      - testgen
    repeat: 10
    input:
      kind: code
      goal: 重复调用验证测试计划与骨架稳定
      content: 稳定性样本 1
      files:
        - path: input/s1.py
          content: "def checkout(cart):

            \    return sum(cart)\n"
      params:
        src: input/s1.py
        framework: pytest
        coverage: 公开函数
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 单元测试生成报告
          weight: 2
          note: 产出标准测试计划报告
        - type: contains
          text: "## 用例清单"
          weight: 1
        - type: contains
          text: checkout
          weight: 2
          note: 确定性对象清单稳定
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 200
          weight: 1
      requiredSuggestions: []
