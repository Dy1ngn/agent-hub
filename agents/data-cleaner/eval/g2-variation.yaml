id: ts-b-data-cleaner-g2-variation
agentId: data-cleaner
group: g2-variation
name: 表格清洗 · 输入变体：格式 / 规模 / 结构
description: TSV、非逗号分隔、宽表、长表、中文列名、日期列、稀疏表、嵌套 JSON 等输入形态变体（模型链路）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g2-tsv-1
    title: TSV 制表符输入（1）
    tags:
      - variation
      - tsv
    repeat: 5
    input:
      kind: table
      goal: 体检 TSV 表格
      content: 这是制表符分隔的表格。
      files:
        - path: input/data.tsv
          content: "id\tname\tscore

            1\t张三\t88

            2\t\t90

            3\t李四\t76

            4\t王五\t\n"
      params:
        file: input/data.tsv
    gold:
      findings: []
      checks:
        - type: contains
          text: 数据质量报告
          weight: 1
          note: 产出标准质量报告
        - type: contains
          text: "## 数据概览"
          weight: 1
          note: 报告固定结构（概览小节）
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: min_length
          value: 200
          weight: 1
          note: 报告不是空壳
        - type: regex
          pattern: (?i)tsv|制表
          weight: 1
          note: 识别 TSV 数据源
        - type: regex
          pattern: (问题|清单|建议)
          weight: 1
          note: 给出问题与建议
      requiredSuggestions: []
