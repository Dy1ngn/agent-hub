id: ts-b-data-cleaner-g3-edge
agentId: data-cleaner
group: g3-edge
name: 表格清洗 · 边界情况：空 / 极小 / 极大 / 无数据
description: 空文件、仅表头、极大数值、超长单元格、BOM、emoji 等边界输入下的稳定产出（离线模式）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g3-edge-1
    title: 边界输入：空文件
    tags:
      - edge
      - offline
    repeat: 5
    input:
      kind: table
      goal: 边界输入也要产出可读报告，不允许崩溃
      content: 样本：空文件
      files:
        - path: input/edge1.csv
          content: ""
      params:
        file: input/edge1.csv
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 数据质量报告
          weight: 2
          note: 边界输入仍产出报告
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: regex
          pattern: 失败文件|空表|没有可体检
          weight: 2
          note: 边界输入的处理结果符合预期
        - type: min_length
          value: 150
          weight: 1
          note: 报告不是空壳
      requiredSuggestions: []
