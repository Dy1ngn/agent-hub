id: ts-b-data-cleaner-g1-basic
agentId: data-cleaner
group: g1-basic
name: 表格清洗 · 基础功能：典型表格质量体检
description: 缺失/重复/异常值/格式等典型质量问题的常规输入，走完整「确定性体检 + 模型解读」链路（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-missing-1
    title: 缺失值体检（CSV）
    tags:
      - basic
      - missing
    repeat: 5
    input:
      kind: table
      goal: 体检表格的缺失值情况
      content: 请对这份表格做质量体检。
      files:
        - path: input/data.csv
          content: "id,name,city,amount

            1,张三,北京,100

            2,,上海,250

            3,李四,,

            4,,,

            5,王五,广州,120\n"
      params:
        file: input/data.csv
    gold:
      findings: []
      checks:
        - type: contains
          text: 数据质量报告
          weight: 1
          note: 产出标准质量报告
        - type: contains
          text: "## 数据概览"
          weight: 1
          note: 报告固定结构（概览小节）
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: min_length
          value: 200
          weight: 1
          note: 报告不是空壳
        - type: regex
          pattern: (缺失值|缺失|空值)
          weight: 2
          note: 识别缺失值问题
      requiredSuggestions: []
