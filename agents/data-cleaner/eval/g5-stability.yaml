id: ts-b-data-cleaner-g5-stability
agentId: data-cleaner
group: g5-stability
name: 表格清洗 · 稳定性：同输入重复调用
description: 10 个确定性样本各重复调用 10 次（离线模式），断言确定性结论稳定出现（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性重复：缺失值表
    tags:
      - stability
      - offline
    repeat: 10
    input:
      kind: table
      goal: 同一输入重复调用 10 次，输出应稳定一致
      content: 样本：缺失值表
      files:
        - path: input/s1.csv
          content: "id,remark

            1,ok

            2,

            3,

            4,fine

            5,good\n"
      params:
        file: input/s1.csv
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 数据质量报告
          weight: 2
          note: 重复调用仍产出报告
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: regex
          pattern: 缺失值
          weight: 2
          note: 确定性结论稳定出现
        - type: contains
          text: 列「remark」有 2/5 个缺失
          weight: 2
          note: 断言确定性细节，验证稳定性
        - type: min_length
          value: 200
          weight: 1
          note: 报告不是空壳
      requiredSuggestions: []
