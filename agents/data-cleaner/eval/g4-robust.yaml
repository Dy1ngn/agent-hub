id: ts-b-data-cleaner-g4-robust
agentId: data-cleaner
group: g4-robust
name: 表格清洗 · 鲁棒性：畸形输入与坏 JSON
description: 列数不齐、未闭合引号、乱码、坏 JSON、NUL 字节、文件不存在等异常输入下优雅处理不崩溃（离线模式）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g4-robust-1
    title: 异常输入：列数不齐
    tags:
      - robust
      - offline
    repeat: 5
    input:
      kind: table
      goal: 异常输入不能让工具崩溃：要么正常分析，要么优雅报错并留下报告
      content: 样本：列数不齐
      files:
        - path: input/bad1.csv
          content: "a,b\n1,2,3\n4\n5,6,7\n"
      params:
        file: input/bad1.csv
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 数据质量报告
          weight: 2
          note: 异常输入仍产出报告
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: regex
          pattern: 数据概览|问题清单
          weight: 2
          note: 优雅处理结果符合预期
        - type: min_length
          value: 150
          weight: 1
          note: 报告不是空壳
      requiredSuggestions: []
