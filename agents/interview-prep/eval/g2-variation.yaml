        - path: input/jd.txt
          content: "职位：金融数据分析师

            职责：负责风控数据监控。

            要求：熟悉风控指标、SQL 与 Python。\n"
        - path: input/record.json
          content: ""
      params:
        type: 综合
        count: "2"
        seed: "42"
        record: ""
    gold:
      findings: []
      checks:
        - type: contains
          text: 岗位画像
          weight: 1
        - type: contains
          text: 风控
          weight: 2
          note: 行业技能词进入画像
        - type: contains
          text: 题目清单
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 600
          weight: 1
