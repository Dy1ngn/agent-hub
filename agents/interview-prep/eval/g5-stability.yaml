      kind: text
      goal: 重复调用验证确定性抽题稳定
      content: 稳定性样本 1：技术面 6 题（seed 42）
      files:
        - path: input/jd.txt
          content: "职位：后端开发工程师

            职责：负责核心交易系统的服务端研发与性能优化。

            要求：

            - 精通 Java 与 Spring Boot 框架

            - 熟悉 MySQL、Redis、Kafka

            - 了解 Kubernetes 容器化部署\n"
        - path: input/record.json
          content: ""
      params:
        offline: true
        type: 技术
        count: "6"
        seed: "42"
        record: ""
    gold:
      findings: []
      checks:
        - type: contains
          text: 面试准备报告
          weight: 2
        - type: contains
          text: 题目数：6
          weight: 2
          note: 确定性出题数量
        - type: contains
          text: 面试类型：技术
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 2
        - type: min_length
          value: 500
          weight: 1
      requiredSuggestions: []
