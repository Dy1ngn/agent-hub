id: ts-b-interview-prep-g5-stability
agentId: interview-prep
group: g5-stability
name: 面试准备 · 稳定性：同输入重复调用
description: 10 个样本各重复 10 次（离线确定性模式），验证同样种子抽出同样题目、结构一致（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
