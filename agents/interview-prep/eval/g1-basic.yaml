id: ts-b-interview-prep-g1-basic
agentId: interview-prep
group: g1-basic
name: 面试准备 · 基础功能：JD 画像 + 抽题 + 框架 + 模拟面试
description: 典型 JD 与面试类型下的完整链路：岗位画像、可复现抽题、答题框架、复习计划与模型模拟面试（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-tech-1
    title: 技术面出题（Java 后端开发工程师）
    tags:
      - basic
      - tech
    repeat: 5
    input:
      kind: text
      goal: 按 JD 抽技术面题目并给答题框架
      content: 请为 Java 后端开发工程师 岗位生成技术面准备文档，重点技能：Java。
      files:
        - path: input/jd.txt
          content: "职位：后端开发工程师

            职责：负责核心交易系统的服务端研发与性能优化。

            要求：

            - 精通 Java 与 Spring Boot 框架

            - 熟悉 MySQL、Redis、Kafka

            - 了解 Kubernetes 容器化部署\n"
        - path: input/record.json
          content: ""
      params:
        type: 技术
        count: "2"
        seed: "42"
        record: ""
    gold:
      findings: []
      checks:
        - type: contains
          text: 面试准备报告
          weight: 1
          note: 产出标准报告
        - type: contains
          text: 岗位画像
          weight: 1
        - type: contains
          text: Java
          weight: 2
          note: JD 技能进入岗位画像
        - type: contains
          text: 题目数：6
          weight: 1
          note: 出题数量确定
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 800
          weight: 1
      requiredSuggestions: []
