            def handler_10():

            \    return 10


            def handler_11():

            \    return 11


            def handler_12():

            \    return 12


            def handler_13():

            \    return 13


            def handler_14():

            \    return 14


            def handler_15():

            \    return 15


            def handler_16():

            \    return 16


            def handler_17():

            \    return 17


            def handler_18():

            \    return 18


