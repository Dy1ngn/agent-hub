group: g2-variation
name: 项目文档生成 · 输入变体：项目规模 / 文件组合 / 文档类型与语言
description: 不同规模、文件组合、文档类型（正交轴）与中英文的变体输入，走模型链路（20 条用例 / 100 次调用）
