        - path: input/big-monolith/requirements.txt
          content: "flask==3.0.0

            requests==2.31.0

            click==8.1.7\n"
      params:
        project_dir: input/big-monolith
        doc_type: readme
        lang: zh
    gold:
      findings: []
      checks:
        - type: min_length
          value: 400
          weight: 1
