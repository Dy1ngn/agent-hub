id: ts-b-doc-writer-g3-edge
agentId: doc-writer
group: g3-edge
name: 项目文档生成 · 边界情况：极小 / 空文件 / 极端规模
description: 空文件、单行、极小项目与超大/超深/怪命名项目，离线确定性输出（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g3-minimal-1
    title: 极小/极短项目（empty-proj）
    tags:
      - edge
      - offline
    repeat: 5
    input:
      kind: text
      goal: 对极小项目做离线骨架文档
      content: 请为 input/empty-proj 项目生成文档。
      files:
        - path: input/empty-proj/notes.txt
          content: ""
      params:
        project_dir: input/empty-proj
        doc_type: readme
        lang: zh
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: empty-proj
          weight: 2
          note: 骨架标题带项目名
        - type: regex
          pattern: (项目简介|接口清单|分层结构|新人上手五步)
          weight: 2
          note: 固定小节标题
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 150
          weight: 1
      requiredSuggestions: []
