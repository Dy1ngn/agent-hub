id: ts-b-doc-writer-g4-robust
agentId: doc-writer
group: g4-robust
name: 项目文档生成 · 鲁棒性：乱码 / 损坏 / 缺字段输入
description: 乱码、空字节、损坏 JSON/配置、缺字段等畸形项目输入，优雅处理不崩溃（离线）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g4-mangle-1
    title: 格式损坏/乱码项目（mojibake）
    tags:
      - robust
      - offline
    repeat: 5
    input:
      kind: text
      goal: 乱码与损坏文件也要优雅处理，生成骨架
      content: 请为 input/mojibake 项目生成文档。
      files:
        - path: input/mojibake/broken.py
          content: "���� 锟斤拷 㡎塡�\n"
      params:
        project_dir: input/mojibake
        doc_type: readme
        lang: zh
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: mojibake
          weight: 2
          note: 骨架标题带项目名
        - type: regex
          pattern: (项目简介|接口清单|分层结构|新人上手五步)
          weight: 2
          note: 固定小节标题
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 150
          weight: 1
      requiredSuggestions: []
