id: ts-b-doc-writer-g5-stability
agentId: doc-writer
group: g5-stability
name: 项目文档生成 · 稳定性：10 样本 × 重复 10 次
description: 10 个确定性样本各重复 10 次，离线输出必须完全一致（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性样本（stable-a）
    tags:
      - stability
      - offline
    repeat: 10
    input:
      kind: text
      goal: 同输入重复运行，输出应完全一致
      content: 请为 input/stable-a 项目生成文档。
      files:
        - path: input/stable-a/app.py
          content: "from flask import Flask


            app = Flask(__name__)


            @app.get(\"/users\")

            def list_users():

            \    return []


            @app.post(\"/users\")

            def create_user():

            \    return {}, 201


            if __name__ == \"__main__\":

            \    app.run()\n"
      params:
        project_dir: input/stable-a
        doc_type: readme
        lang: zh
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: stable-a
          weight: 1
        - type: contains
          text: "## 项目简介"
          weight: 2
          note: 固定小节标题
        - type: contains
          text: app.py
          weight: 1
          note: 扫描到的文件名出现在目录结构里
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 150
          weight: 1
      requiredSuggestions: []
