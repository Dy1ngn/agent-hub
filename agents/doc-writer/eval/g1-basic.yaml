id: ts-b-doc-writer-g1-basic
agentId: doc-writer
group: g1-basic
name: 项目文档生成 · 基础功能：典型项目文档生成
description: 四类文档的典型小项目输入，走完整「静态扫描 + 模型生成」链路（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-readme-1
    title: Python Web 项目生成 README（flask-blog）
    tags:
      - basic
      - readme
    repeat: 5
    input:
      kind: text
      goal: 扫描 input/flask-blog 项目并生成 readme 文档（zh）
      content: 请为 input/flask-blog 项目生成 README 文档。
      files:
        - path: input/flask-blog/app.py
          content: "from flask import Flask


            app = Flask(__name__)


            @app.get(\"/users\")

            def list_users():

            \    return []


            @app.post(\"/users\")

            def create_user():

            \    return {}, 201


            if __name__ == \"__main__\":

            \    app.run()\n"
        - path: input/flask-blog/requirements.txt
          content: "flask==3.0.0

            requests==2.31.0

            click==8.1.7\n"
      params:
        project_dir: input/flask-blog
        doc_type: readme
        lang: zh
    gold:
      findings: []
      checks:
        - type: regex
          pattern: (功能特性|Features|特性)
          weight: 2
          note: README 功能特性小节
        - type: regex
          pattern: (安装|Installation|安装步骤)
          weight: 2
          note: README 安装小节
        - type: contains
          text: flask-blog
          weight: 2
          note: 报告出现项目名（来自扫描摘要）
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
