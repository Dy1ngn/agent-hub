      kind: text
      goal: 扫描 input/order-gateway 项目并生成 arch 文档
      content: 请为 input/order-gateway 项目生成架构说明。
      files:
        - path: input/order-gateway/index.js
          content: 'const express = require("express");

            const app = express();


            app.get("/api/orders", (req, res) => res.json({ ok: true }));

            app.post("/api/orders", (req, res) => res.status(201).json({ ok: true }));


            app.listen(3000);

            '
        - path: input/order-gateway/package.json
          content: "{

            \  \"name\": \"order-gateway\",

            \  \"version\": \"1.0.0\",

            \  \"scripts\": { \"start\": \"node index.js\", \"test\": \"node test.js\" },

            \  \"dependencies\": { \"express\": \"^4.18.0\" }

            }\n"
      params:
        project_dir: input/order-gateway
        doc_type: arch
        lang: zh
