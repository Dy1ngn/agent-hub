id: ts-b-meeting-minutes-g1-basic
agentId: meeting-minutes
group: g1-basic
name: 会议纪要 · 基础功能：典型会议逐字稿
description: 评审会/站会/复盘会/多议题/分工等典型逐字稿，走完整「解析 + 模型整理」链路（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-review-1
    title: 产品评审会（支付模块上线评审）
    tags:
      - basic
      - review
    repeat: 5
    input:
      kind: text
      goal: 解析产品评审逐字稿并生成纪要
      content: 请生成会议纪要。
      files:
        - path: input/transcript.txt
          content: "[09:30] 张三：各位好，今天讨论支付模块上线安排。

            [09:31] 李四：目前接口已经全部联调完成，测试覆盖率 82%。

            [09:35] 王五：灰度方案我建议先放 10% 流量，观察两天。

            [09:40] 张三：决定下周一开始灰度发布，李四负责监控。

            [09:45] 李四：我负责监控告警，周五前给出观察报告。

            [09:50] 王五：遗留问题是回滚预案还没有评审。\n"
      params:
        title: 支付模块上线评审
        date: 2026-10-28
    gold:
      findings: []
      checks:
        - type: contains
          text: 张三
          weight: 2
          note: 发言人回显
        - type: contains
          text: "## 决议"
          weight: 1
        - type: regex
          pattern: (灰度|发布|监控)
          weight: 1
          note: 讨论要点进入纪要
        - type: contains
          text: "# 会议纪要：支付模块上线评审"
          weight: 2
          note: 标题回显
        - type: contains
          text: "## 会议信息"
          weight: 1
        - type: contains
          text: "## 发言统计"
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 400
          weight: 1
      requiredSuggestions: []
