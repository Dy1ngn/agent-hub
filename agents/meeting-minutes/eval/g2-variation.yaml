id: ts-b-meeting-minutes-g2-variation
agentId: meeting-minutes
group: g2-variation
name: 会议纪要 · 输入变体：长度 / 人数 / 格式 / 参数
description: 逐字稿长度、参与人数、书写格式与标题日期参数变体，走模型链路（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g2-length-1
    title: 逐字稿长度变体（极短会）
    tags:
      - variation
      - length
    repeat: 5
    input:
      kind: text
      goal: 处理不同长度的逐字稿
      content: 请生成会议纪要。
      files:
        - path: input/transcript.txt
          content: "张三：好。\n"
      params:
        title: 极短会
        date: 2026-10-28
    gold:
      findings: []
      checks:
        - type: contains
          text: 极短会
          weight: 2
        - type: contains
          text: "## 会议信息"
          weight: 1
        - type: contains
          text: "# 会议纪要：极短会"
          weight: 2
          note: 标题回显
        - type: contains
          text: "## 会议信息"
          weight: 1
        - type: contains
          text: "## 发言统计"
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 400
          weight: 1
      requiredSuggestions: []
