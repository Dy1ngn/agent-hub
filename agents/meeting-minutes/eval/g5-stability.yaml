  - id: g5-stable-1
    title: 稳定性样本（支付模块上线评审）
    tags:
      - stability
      - offline
    repeat: 10
    input:
      kind: text
      goal: 同输入重复运行，输出应完全一致
      content: 请生成会议纪要。
      files:
        - path: input/transcript.txt
          content: "[09:30] 张三：各位好，今天讨论支付模块上线安排。

            [09:31] 李四：目前接口已经全部联调完成，测试覆盖率 82%。

            [09:35] 王五：灰度方案我建议先放 10% 流量，观察两天。

            [09:40] 张三：决定下周一开始灰度发布，李四负责监控。

            [09:45] 李四：我负责监控告警，周五前给出观察报告。

            [09:50] 王五：遗留问题是回滚预案还没有评审。\n"
      params:
        title: 支付模块上线评审
        date: 2026-10-28
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: "# 会议纪要：支付模块上线评审"
          weight: 1
        - type: contains
          text: 张三
          weight: 2
          note: 发言人回显
        - type: contains
          text: "## 发言统计"
          weight: 1
        - type: contains
          text: 2026-10-28
          weight: 1
          note: 会议日期回显
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
