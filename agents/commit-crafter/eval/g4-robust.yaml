id: ts-b-commit-crafter-g4-robust
agentId: commit-crafter
group: g4-robust
name: 提交信息生成 · 鲁棒性：畸形 / 乱码 / 缺字段
description: 乱码、控制字符、零宽字符、畸形 hunk、缺字段、极端参数下优雅处理不崩溃（离线启发式模式；style/lang 覆盖常规与极端组合）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g4-robust-1
    title: 异常输入：乱码内容
    tags:
      - robust
      - offline
    repeat: 5
    input:
      kind: code
      goal: 畸形/乱码/缺字段输入不能让工具崩溃
      content: 异常用例：乱码内容
      files:
        - path: input/change.diff
          content: "diff --git a/a.py b/a.py

            index 111..222 100644

            --- a/a.py

            +++ b/a.py

            @@ -1 +1 @@

            -ä½ å¥½

            +æ ½è¿\n"
      params:
        style: conventional
        lang: zh
        maxchars: "60000"
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 最终提交信息
          weight: 2
          note: 异常输入仍产出预览
        - type: contains
          text: 候选类型
          weight: 1
        - type: regex
          pattern: "(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([^)]*\\))?!?: "
          weight: 2
          note: 异常输入下兜底 subject 仍合规
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: min_length
          value: 120
          weight: 1
      requiredSuggestions: []
