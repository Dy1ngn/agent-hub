id: ts-b-commit-crafter-g1-basic
agentId: commit-crafter
group: g1-basic
name: 提交信息生成 · 基础功能：典型改动的提交信息生成
description: 新增/修复/文档/测试/CI/依赖/多文件/破坏性/性能/锁文件等典型改动，走「diff 直读 + 模型生成」完整链路（启发式候选类型为确定性金标）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-feat-1
    title: 新增业务源文件（python）
    tags:
      - commit
    repeat: 5
    input:
      kind: code
      goal: 为新增源文件的改动生成规范提交信息
      content: 这批改动新增了一个业务源文件，请生成提交信息预览。
      files:
        - path: input/change.diff
          content: "diff --git a/src/checkout.py b/src/checkout.py

            new file mode 100644

            index 0000000..e69de29

            --- /dev/null

            +++ b/src/checkout.py

            @@ -0,0 +1,3 @@

            +def checkout(cart):

            +    total = sum(item.price for item in cart)

            +    return charge(total)\n"
      params:
        style: conventional
        lang: zh
        maxchars: "60000"
    gold:
      findings: []
      checks:
        - type: contains
          text: 最终提交信息
          weight: 1
          note: 产出标准预览报告
        - type: contains
          text: 候选类型：feat
          weight: 2
          note: 启发式类型判定确定性正确
        - type: regex
          pattern: "(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([^)]*\\))?!?: "
          weight: 2
          note: 最终 subject 带合规 type 前缀
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 150
          weight: 1
      requiredSuggestions: []
