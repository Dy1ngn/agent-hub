id: ts-b-commit-crafter-g2-variation
agentId: commit-crafter
group: g2-variation
name: 提交信息生成 · 输入变体：风格 / 语言 / 规模 / 参数
description: conventional/gitmoji/plain 三种风格、zh/en 两种语言，叠加 diff 形态与 --max-diff-chars 参数变体（模型链路）（50 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g2-style-1
    title: 单行修改 · 风格 conventional
    tags:
      - variation
      - style
    repeat: 2
    input:
      kind: code
      goal: 用指定提交信息风格为改动生成提交信息
      content: 风格变体样本 1（单行修改 / conventional）
      files:
        - path: input/change.diff
          content: "diff --git a/src/config.py b/src/config.py

            index 1111111..2222222 100644

            --- a/src/config.py

            +++ b/src/config.py

            @@ -1,1 +1,1 @@

            -TIMEOUT = 30

            +TIMEOUT = 60\n"
      params:
        style: conventional
        lang: zh
        maxchars: "60000"
    gold:
      findings: []
      checks:
        - type: contains
          text: 最终提交信息
          weight: 1
        - type: regex
          pattern: "(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([^)]*\\))?!?: "
          weight: 2
          note: 三种风格下 subject 仍带 type 前缀
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 150
          weight: 1
      requiredSuggestions: []
