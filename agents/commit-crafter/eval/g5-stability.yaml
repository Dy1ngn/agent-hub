id: ts-b-commit-crafter-g5-stability
agentId: commit-crafter
group: g5-stability
name: 提交信息生成 · 稳定性：同输入重复调用
description: 10 个样本各重复调用 10 次（离线启发式模式），验证输出稳定、分类一致、不崩溃（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性重复：样本 1
    tags:
      - stability
      - offline
    repeat: 10
    input:
      kind: code
      goal: 重复调用验证输出稳定
      content: 稳定性样本 1
      files:
        - path: input/change.diff
          content: "diff --git a/src/feature.py b/src/feature.py

            new file mode 100644

            index 0000000..e69de29

            --- /dev/null

            +++ b/src/feature.py

            @@ -0,0 +1,2 @@

            +def feature():

            +    return 'ok'\n"
      params:
        style: conventional
        lang: zh
        maxchars: "60000"
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 最终提交信息
          weight: 2
        - type: contains
          text: 候选类型：feat
          weight: 2
          note: 确定性分类稳定
        - type: regex
          pattern: "(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([^)]*\\))?!?: "
          weight: 2
        - type: not_contains
          text: Traceback
          weight: 2
        - type: min_length
          value: 120
          weight: 1
      requiredSuggestions: []
