id: ts-b-commit-crafter-g3-edge
agentId: commit-crafter
group: g3-edge
name: 提交信息生成 · 边界情况：空 / 超短 / 超长 / 极端参数
description: 空 diff、单字符、超长单行、超多文件、截断参数等边界输入下的稳定产出（离线启发式模式）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g3-edge-1
    title: 边界输入：空 diff（0 字节）
    tags:
      - edge
      - offline
    repeat: 5
    input:
      kind: code
      goal: 边界输入也要产出结构完整的提交信息预览
      content: 边界用例：空 diff（0 字节）
      files:
        - path: input/change.diff
          content: ""
      params:
        style: conventional
        lang: zh
        maxchars: "60000"
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 最终提交信息
          weight: 2
          note: 边界输入仍产出预览
        - type: contains
          text: 候选类型
          weight: 1
        - type: regex
          pattern: "(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([^)]*\\))?!?: "
          weight: 2
          note: 兜底 subject 仍带 type 前缀
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: min_length
          value: 120
          weight: 1
      requiredSuggestions: []
