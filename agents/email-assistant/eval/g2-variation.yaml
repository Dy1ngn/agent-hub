id: ts-b-email-assistant-g2-variation
agentId: email-assistant
group: g2-variation
name: 邮件助手 · 输入变体：长度 / 语气参数 / 多文件 / 邮件头风格
description: 正文长度、回复语气参数、多文件混合与邮件头风格变体，走模型链路（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g2-length-1
    title: 正文长度变体（一句话通知）
    tags:
      - variation
      - length
    repeat: 5
    input:
      kind: text
      goal: 处理不同长度的邮件正文
      content: 请处理 input/ 目录下的邮件。
      files:
        - path: input/tiny.txt
          content: "Subject: 一句话通知

            From: a@example.com

            To: b@example.com


            好。\n"
      params:
        tone: 正式
    gold:
      findings: []
      checks:
        - type: contains
          text: 一句话通知
          weight: 2
        - type: contains
          text: "### 正文（已剥离引用，共剥离 0 行）"
          weight: 1
        - type: contains
          text: "# 邮件处理报告"
          weight: 2
          note: 报告固定标题
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 400
          weight: 1
      requiredSuggestions: []
