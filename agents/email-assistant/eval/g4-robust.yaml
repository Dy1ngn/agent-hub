id: ts-b-email-assistant-g4-robust
agentId: email-assistant
group: g4-robust
name: 邮件助手 · 鲁棒性：损坏 / 乱码 / 缺字段
description: 损坏邮件头、乱码、空字节、坏编码、缺字段等畸形输入，优雅处理不崩溃（离线）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g4-broken-1
    title: 格式损坏邮件 + 正常邮件（兜底邮件）
    tags:
      - robust
      - offline
    repeat: 5
    input:
      kind: text
      goal: 损坏邮件不崩溃，正常邮件照常出报告
      content: 请处理 input/ 目录下的邮件。
      files:
        - path: input/garbage.eml
          content: "!!! not an email at all !!!

            \x01\x02\x03\n"
        - path: input/keep.txt
          content: "Subject: 兜底邮件

            From: keeper@example.com

            To: bob@example.com


            这是一封格式正常的邮件，用于保证有可解析的输入。\n"
      params:
        tone: 正式
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 兜底邮件
          weight: 2
          note: 正常邮件主题回显
        - type: contains
          text: "## 汇总统计"
          weight: 1
        - type: contains
          text: "# 邮件处理报告"
          weight: 2
          note: 报告固定标题
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 400
          weight: 1
      requiredSuggestions: []
