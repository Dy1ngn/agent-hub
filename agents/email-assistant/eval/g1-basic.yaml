id: ts-b-email-assistant-g1-basic
agentId: email-assistant
group: g1-basic
name: 邮件助手 · 基础功能：典型邮件处理
description: 紧急/账单/资讯/多收件人/mbox/纯文本/附件等典型邮件输入，走完整「解析 + 模型分析」链路（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-urgent-1
    title: 紧急邮件：优先级高（紧急：合同确认（请今天内回复））
    tags:
      - basic
      - priority
    repeat: 5
    input:
      kind: text
      goal: 解析紧急邮件并给出优先级、待办与草稿
      content: 请处理 input/ 目录下的紧急邮件。
      files:
        - path: input/urgent.txt
          content: "Subject: 紧急：合同确认（请今天内回复）

            From: 张三 <zhangsan@example.com>

            To: 李四 <lisi@example.com>


            李四，你好：

            这封邮件比较紧急，请在 2026-10-30 前确认合同金额 12000 元是否正确？

            请尽快回复：是否需要法务复核？能否今天内给出结论？\n"
      params:
        tone: 正式
    gold:
      findings: []
      checks:
        - type: contains
          text: 紧急：合同确认（请今天内回复）
          weight: 2
          note: 邮件主题出现在报告里
        - type: regex
          pattern: 级别：\*\*高\*\*
          weight: 2
          note: 紧急邮件判为高优先级
        - type: contains
          text: "### 待办与关键信息"
          weight: 1
        - type: contains
          text: "# 邮件处理报告"
          weight: 2
          note: 报告固定标题
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 400
          weight: 1
      requiredSuggestions: []
