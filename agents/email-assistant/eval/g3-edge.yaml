id: ts-b-email-assistant-g3-edge
agentId: email-assistant
group: g3-edge
name: 邮件助手 · 边界情况：空 / 极短 / 极端数值
description: 空邮件、极短正文、超长主题/正文、极端金额等边界输入，离线确定性输出（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g3-minimal-1
    title: 极小/空邮件（empty）
    tags:
      - edge
      - offline
    repeat: 5
    input:
      kind: text
      goal: 极小与空内容邮件也要优雅处理
      content: 请处理 input/ 目录下的邮件。
      files:
        - path: input/empty.txt
          content: ""
      params:
        tone: 正式
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: empty
          weight: 2
        - type: regex
          pattern: (正文为空|无摘要|摘要)
          weight: 1
        - type: contains
          text: "# 邮件处理报告"
          weight: 2
          note: 报告固定标题
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 400
          weight: 1
      requiredSuggestions: []
