id: ts-b-email-assistant-g5-stability
agentId: email-assistant
group: g5-stability
name: 邮件助手 · 稳定性：10 样本 × 重复 10 次
description: 10 个确定性邮件样本各重复 10 次，离线输出必须完全一致（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性样本（紧急：合同确认（请今天内回复））
    tags:
      - stability
      - offline
    repeat: 10
    input:
      kind: text
      goal: 同输入重复运行，输出应完全一致
      content: 请处理 input/ 目录下的邮件。
      files:
        - path: input/s1.txt
          content: "Subject: 紧急：合同确认（请今天内回复）

            From: 张三 <zhangsan@example.com>

            To: 李四 <lisi@example.com>


            李四，你好：

            这封邮件比较紧急，请在 2026-10-30 前确认合同金额 12000 元是否正确？

            请尽快回复：是否需要法务复核？能否今天内给出结论？\n"
      params:
        tone: 正式
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: "# 邮件处理报告"
          weight: 1
        - type: contains
          text: 紧急：合同确认（请今天内回复）
          weight: 2
          note: 主题回显
        - type: contains
          text: "## 汇总统计"
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
