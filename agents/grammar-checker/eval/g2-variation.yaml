      params:
        lang: auto
        min: 提示
    gold:
      findings: []
      checks:
        - type: contains
          text: 校对报告
          weight: 1
        - type: contains
          text: 语言模式：自动（中英混合）
          weight: 2
          note: 报告元信息记录语言模式参数
