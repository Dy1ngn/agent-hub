id: ts-b-grammar-checker-g5-stability
agentId: grammar-checker
group: g5-stability
name: 中英校对 · 稳定性：同输入重复调用
description: 10 个样本各重复调用 10 次（离线纯规则模式），验证输出稳定、不崩溃、结构一致（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性重复：样本 1
    tags:
      - stability
      - offline
    repeat: 10
    input:
      kind: text
      goal: 重复调用验证校对输出稳定
      content: "他快速的跑向终点。\n她的认真地态度让人佩服。\n"
      files: []
      params:
        lang: auto
        min: 提示
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 校对报告
          weight: 2
        - type: contains
          text: 概览
          weight: 1
        - type: regex
          pattern: GR[0-9][0-9][0-9]
          weight: 2
          note: 规则命中带规则编号
        - type: not_contains
          text: Traceback
          weight: 2
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
