id: ts-b-grammar-checker-g1-basic
agentId: grammar-checker
group: g1-basic
name: 中英校对 · 基础功能：典型中英校对问题
description: 典型错别字/标点/空格/语法问题的完整校对链路（规则表 + 模型语义校对），规则命中为确定性断言（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-dedide
    title: 的地得误用（短句样本）
    tags:
      - basic
      - chinese
    repeat: 5
    input:
      kind: text
      goal: 校对这段中文文本里的错别字与语法问题
      content: "他快速的跑向终点。\n她的认真地态度让人佩服。\n"
      files: []
      params:
        lang: auto
        min: 提示
    gold:
      findings: []
      checks:
        - type: contains
          text: 校对报告
          weight: 1
          note: 产出标准校对报告
        - type: contains
          text: 概览
          weight: 1
          note: 概览章节存在
        - type: regex
          pattern: GR001
          weight: 2
          note: 确定性命中对应规则
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
