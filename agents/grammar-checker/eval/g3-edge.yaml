id: ts-b-grammar-checker-g3-edge
agentId: grammar-checker
group: g3-edge
name: 中英校对 · 边界情况：空 / 极短 / 极端参数
description: 空文件、极短文本、纯符号与极端参数组合下的稳定产出（离线纯规则模式）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
