      kind: text
      goal: 边界输入也要产出校对报告
      content: ""
      files: []
      params:
        lang: auto
        min: 提示
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 校对报告
          weight: 2
          note: 边界输入仍产出校对报告
        - type: contains
          text: 附录：文件清单
          weight: 1
          note: 附录章节仍存在
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 150
          weight: 1
      requiredSuggestions: []
