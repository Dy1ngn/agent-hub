    repeat: 5
    input:
      kind: code
      goal: 不同规模的代码都要产出结构完整的讲解
      content: "import json

        import os



        def read_lines(path):

        \    with open(path, encoding=\"utf-8\") as handle:

        \        return [line.strip() for line in handle if line.strip()]



        def parse_line(line):

        \    parts = line.split(\",\")

        \    if len(parts) < 3:

        \        return None

        \    return {\"id\": parts[0], \"name\": parts[1], \"score\": float(parts[2])}



        def validate(row):

        \    if row is None:

        \        return False

        \    if not row[\"id\"]:

        \        return False

        \    return 0 <= row[\"score\"] <= 100



        def load_rows(path):

        \    rows = []

        \    for line in read_lines(path):

        \        row = parse_line(line)

        \        if validate(row):

        \            rows.append(row)

        \    return rows



        def average(rows):

        \    if not rows:

        \        return 0.0

        \    return sum(r[\"score\"] for r in rows) / len(rows)



        def write_report(rows, out_path):

        \    report = {\"count\": len(rows), \"average\": average(rows), \"rows\": rows}

        \    with open(out_path, \"w\", encoding=\"utf-8\") as handle:

        \        json.dump(report, handle, ensure_ascii=False, indent=2)



        def process_all(in_path, out_path):

        \    rows = load_rows(in_path)

        \    write_report(rows, out_path)

        \    return len(rows)\n"
      files: []
      params:
