        import java.util.Map;


        public class Cache<K, V> extends LinkedHashMap<K, V> {

        \    private final int capacity;


        \    public Cache(int capacity) {

        \        super(capacity + 1, 1f, true);

        \        this.capacity = capacity;

        \    }


