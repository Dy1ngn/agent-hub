id: ts-b-code-explainer-g3-edge
agentId: code-explainer
group: g3-edge
name: 代码讲解 · 边界情况：空 / 极短 / 极端参数
description: 空文件、单字符、纯注释、超长内容与极端参数组合下的稳定产出（离线骨架讲解）（20 条用例 / 100 次调用）
