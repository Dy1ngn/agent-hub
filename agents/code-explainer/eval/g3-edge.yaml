      kind: code
      goal: 边界输入也要产出结构完整的讲解文档
      content: ""
      files: []
      params:
        lang: auto
        level: 中级
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 代码讲解
          weight: 2
          note: 边界输入仍产出讲解文档
        - type: contains
          text: 结构表
          weight: 1
          note: 确定性结构章节仍存在
        - type: not_contains
          text: Traceback
          weight: 1
          note: 不允许 Python 崩栈
