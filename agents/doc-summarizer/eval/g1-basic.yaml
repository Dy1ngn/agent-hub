name: 长文摘要 · 基础功能：典型长文摘要
description: 典型长文档（报告/技术文档/新闻/纪要等）的完整摘要链路（抽取式打分 + 模型生成），产出结构化摘要报告（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-annual
    title: 年度业绩报告摘要（主题：营收）
    tags:
      - basic
      - report
    repeat: 5
    input:
      kind: text
      goal: 为这份年度报告生成中文摘要报告
      content: "# 2025 年度业绩报告


        本年度公司营收达到 48 亿元，同比增长 18%。营收增长主要来自云服务与数据平台两条主线。

        在成本侧，全年运营成本 31 亿元，成本率同比下降 2 个百分点，经营效率明显改善。

        分区域看，华东区域营收增长最快，海外营收占比提升到 22%。营收结构进一步均衡。

        展望 2026 年，公司将继续围绕营收增长目标投入研发，重点推进数据平台产品化。\n"
      files:
        - path: input/extra.md
          content: ""
      params:
        level: standard
        keywords: "10"
    gold:
      findings: []
      checks:
        - type: contains
          text: 文档摘要报告
          weight: 1
          note: 产出标准摘要报告
