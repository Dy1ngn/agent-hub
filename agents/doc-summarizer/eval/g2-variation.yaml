id: ts-b-doc-summarizer-g2-variation
agentId: doc-summarizer
group: g2-variation
name: 长文摘要 · 输入变体：结构 / 规模 / 语言 / 参数组合
description: 不同文档结构、规模、语言与 level/keywords 参数组合下的摘要表现（模型生成链路）（20 条用例 / 100 次调用）
judge:
