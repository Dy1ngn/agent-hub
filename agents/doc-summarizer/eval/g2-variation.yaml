  rubric: review-quality
  weight: 0.3
cases:
  - id: g2-struct-1
    title: 文档结构变体（多级标题 markdown）
    tags:
      - variation
      - structure
    repeat: 5
    input:
      kind: text
      goal: 不同结构的文档都要产出完整摘要
      content: "# 总体介绍


        平台服务面向企业客户提供数据处理能力。


        ## 子模块一


        数据接入模块支持多种数据源接入。


        ### 细节


        接入延迟控制在秒级。


        ## 子模块二


        数据清洗模块内置常见清洗规则。\n"
      files:
        - path: input/extra.md
          content: ""
      params:
        level: standard
        keywords: "10"
    gold:
      findings: []
      checks:
        - type: contains
          text: 文档摘要报告
          weight: 1
        - type: contains
          text: 章节结构
          weight: 1
          note: 结构树章节存在
        - type: regex
          pattern: 正文共 [0-9]+ 个段落
          weight: 1
          note: 统计行格式稳定
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 300
          weight: 1
