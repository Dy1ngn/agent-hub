id: ts-b-doc-summarizer-g5-stability
agentId: doc-summarizer
group: g5-stability
name: 长文摘要 · 稳定性：同输入重复调用
description: 10 个样本各重复调用 10 次（离线抽取式），验证输出稳定、不崩溃、结构一致（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性重复：样本 1
    tags:
      - stability
      - offline
    repeat: 10
    input:
      kind: text
      goal: 重复调用验证摘要输出稳定
      content: "# 年度报告


        公司营收稳步增长，利润率达到预期目标。研发投入持续加大，新产品收入占比提升。

        海外业务扩展顺利，客户结构进一步均衡。\n"
      files:
        - path: input/extra.md
          content: ""
      params:
        level: standard
        keywords: "10"
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 文档摘要报告
          weight: 2
        - type: contains
          text: 要点
          weight: 1
        - type: contains
          text: 抽取式原句
          weight: 1
          note: 离线抽取章节存在
        - type: not_contains
          text: Traceback
          weight: 2
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
