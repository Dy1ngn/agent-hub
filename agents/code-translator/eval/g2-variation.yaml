id: ts-b-code-translator-g2-variation
agentId: code-translator
group: g2-variation
name: 代码翻译 · 输入变体：语言组合 / 规模 / 风格
description: 五语言两两组合、长文件/带注释/React/结构体等风格变体，覆盖大小规模（模型链路）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g2-variant-1
    title: svc.py → javascript（变体 1）
    tags:
      - translate
    repeat: 5
    input:
      kind: code
      goal: 在不同语言组合、代码规模与风格下完成翻译
      content: 翻译变体样本 1：svc.py → javascript
      files:
        - path: input/svc.py
          content: "import os

            import json


            CONFIG_PATH = 'config.json'


            def load_config():

            \    if not os.path.exists(CONFIG_PATH):

            \        return {}

            \    with open(CONFIG_PATH) as f:

            \        return json.loads(f.read())


            def save_config(cfg):

            \    with open(CONFIG_PATH, 'w') as f:

            \        f.write(json.dumps(cfg, indent=2))


            class Service:

            \    def __init__(self, name):

            \        self.name = name

            \        self.handlers = {}


            \    def register(self, key, fn):

            \        self.handlers[key] = fn


            \    def dispatch(self, key, payload):

            \        fn = self.handlers.get(key)

            \        if fn is None:

            \            print('no handler', key)

            \            return None

            \        return fn(payload)


            def main():

            \    svc = Service('demo')

            \    svc.register('ping', lambda p: {'pong': p})

            \    print(svc.dispatch('ping', 1))\n"
      params:
        src: input/svc.py
        target: javascript
    gold:
      findings: []
      checks:
        - type: contains
          text: 代码翻译报告
          weight: 2
          note: 产出标准翻译报告
        - type: contains
          text: "## 映射命中清单"
          weight: 1
        - type: contains
          text: "## 结构对照"
          weight: 1
        - type: regex
          pattern: (映射命中|结构对照|术语)
          weight: 1
          note: 报告包含确定性分析
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
