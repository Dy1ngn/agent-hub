id: ts-b-code-translator-g4-robust
agentId: code-translator
group: g4-robust
name: 代码翻译 · 鲁棒性：畸形 / 乱码 / 控制字符
description: 语法损坏、乱码、控制字符、零宽字符、NUL、混缩进等异常输入下优雅处理不崩溃（离线确定性模式）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g4-robust-1
    title: 异常输入：语法损坏
    tags:
      - translate
    repeat: 5
    input:
      kind: code
      goal: 畸形/乱码/控制字符输入不能让工具崩溃
      content: 异常用例：语法损坏
      files:
        - path: input/broken.py
          content: "def broken(:\n    pass\n@@@ ###\n"
      params:
        src: input/broken.py
        target: javascript
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 代码翻译报告
          weight: 2
          note: 产出标准翻译报告
        - type: contains
          text: "## 映射命中清单"
          weight: 1
        - type: contains
          text: "## 结构对照"
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 200
          weight: 1
      requiredSuggestions: []
