id: ts-b-code-translator-g3-edge
agentId: code-translator
group: g3-edge
name: 代码翻译 · 边界情况：空 / 超短 / 超长 / 极端参数
description: 空文件、单字符、纯注释、超长、纯数据、极端目标语言等边界输入下的稳定产出（离线确定性模式）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g3-edge-1
    title: 边界输入：空文件
    tags:
      - translate
    repeat: 5
    input:
      kind: code
      goal: 边界输入也要产出结构完整的翻译报告
      content: 边界用例：空文件
      files:
        - path: input/empty.py
          content: ""
      params:
        src: input/empty.py
        target: javascript
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 代码翻译报告
          weight: 2
          note: 产出标准翻译报告
        - type: contains
          text: "## 映射命中清单"
          weight: 1
        - type: contains
          text: "## 结构对照"
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 200
          weight: 1
      requiredSuggestions: []
