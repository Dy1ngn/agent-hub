id: ts-b-code-translator-g5-stability
agentId: code-translator
group: g5-stability
name: 代码翻译 · 稳定性：同输入重复调用
description: 10 个样本各重复调用 10 次（离线确定性模式），验证译文与报告稳定、结构一致（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性重复：样本 1
    tags:
      - translate
    repeat: 10
    input:
      kind: code
      goal: 重复调用验证翻译报告稳定
      content: 稳定性样本 1
      files:
        - path: input/s1.py
          content: "def greet(name):

            \    print('hi', name)

            \    return name.strip()\n"
      params:
        src: input/s1.py
        target: javascript
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 代码翻译报告
          weight: 2
          note: 产出标准翻译报告
        - type: contains
          text: "## 映射命中清单"
          weight: 1
        - type: contains
          text: "## 结构对照"
          weight: 1
        - type: contains
          text: console.log
          weight: 1
          note: 确定性映射/结构输出稳定
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 200
          weight: 1
      requiredSuggestions: []
