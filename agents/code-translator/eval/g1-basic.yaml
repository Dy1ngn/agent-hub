id: ts-b-code-translator-g1-basic
agentId: code-translator
group: g1-basic
name: 代码翻译 · 基础功能：典型跨语言翻译
description: python/javascript/typescript/go/java 五个方向的典型源码翻译，走「语言检测 + 术语映射 + 模型翻译 + 语法自检」完整链路（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-translate-1
    title: users.py → javascript
    tags:
      - translate
    repeat: 5
    input:
      kind: code
      goal: 把给定源码翻译成目标语言，产出译文与中文翻译报告
      content: 请把 input/ 目录下的源码翻译成目标语言，报告里给出术语映射与结构对照。
      files:
        - path: input/users.py
          content: "import json


            def load_users(path):

            \    with open(path) as f:

            \        data = json.loads(f.read())

            \    users = data.get('users', [])

            \    print('loaded', len(users))

            \    return users


            def summarize(users):

            \    names = [u['name'].strip() for u in users]

            \    return ', '.join(names)\n"
      params:
        src: input/users.py
        target: javascript
    gold:
      findings: []
      checks:
        - type: contains
          text: 代码翻译报告
          weight: 2
          note: 产出标准翻译报告
        - type: contains
          text: "## 映射命中清单"
          weight: 1
        - type: contains
          text: "## 结构对照"
          weight: 1
        - type: contains
          text: console.log
          weight: 1
          note: 确定性命中/结构输出
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
