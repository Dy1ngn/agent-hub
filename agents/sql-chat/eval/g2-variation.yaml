id: ts-b-sql-chat-g2-variation
agentId: sql-chat
group: g2-variation
name: SQL 问答 · 输入变体：参数 / 结构 / 多表
description: 结果截断、中文列名、空值、宽表、日期、目录多表、多聚合、别名等变体（模型链路）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g2-limit-1
    title: 结果截断（limit=2）
    tags:
      - variation
      - params
    repeat: 5
    input:
      kind: table
      goal: 验证结果行数上限
      content: 请用中文回答这个数据问题，并给出只读 SQL 与结果表。
      files:
        - path: input/data.csv
          content: "id,city,amount

            1,北京,100

            2,上海,250

            3,北京,80

            4,广州,120

            5,上海,60

            6,深圳,200\n"
        - path: input/extra.csv
          content: "k,v\n1,2\n"
      params:
        src: input/data.csv
        q: 列出全部记录
        sql: SELECT * FROM data
        limit: "2"
    gold:
      findings: []
      checks:
        - type: contains
          text: sql-chat 查询结果
          weight: 1
          note: 产出标准查询报告
        - type: contains
          text: "## 结论"
          weight: 1
          note: 报告固定结构（结论小节）
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: min_length
          value: 100
          weight: 1
          note: 报告不是空壳
        - type: regex
          pattern: (已截断|查询结果)
          weight: 2
          note: 截断行为正确
      requiredSuggestions: []
