id: ts-b-sql-chat-g1-basic
agentId: sql-chat
group: g1-basic
name: SQL 问答 · 基础功能：典型中文数据问答
description: 分组计数、汇总、最值、过滤、多表、无匹配、JSON/TSV 数据源等典型问答（自然语言→SQL 模型链路）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-count-1
    title: 分组计数（CSV）
    tags:
      - basic
      - aggregate
    repeat: 5
    input:
      kind: table
      goal: 每个城市有多少条记录
      content: 请用中文回答这个数据问题，并给出只读 SQL 与结果表。
      files:
        - path: input/data.csv
          content: "id,city,amount

            1,北京,100

            2,上海,250

            3,北京,80

            4,广州,120

            5,上海,60\n"
        - path: input/extra.csv
          content: "k,v\n1,2\n"
      params:
        src: input/data.csv
        q: 每个城市有多少条记录？
        sql: SELECT city, COUNT(*) AS cnt FROM data GROUP BY city
        limit: "200"
    gold:
      findings: []
      checks:
        - type: contains
          text: sql-chat 查询结果
          weight: 1
          note: 产出标准查询报告
        - type: contains
          text: "## 结论"
          weight: 1
          note: 报告固定结构（结论小节）
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: min_length
          value: 100
          weight: 1
          note: 报告不是空壳
        - type: regex
          pattern: (北京|上海|城市)
          weight: 2
          note: 结果包含城市分组
      requiredSuggestions: []
