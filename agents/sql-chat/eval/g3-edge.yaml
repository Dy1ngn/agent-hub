id: ts-b-sql-chat-g3-edge
agentId: sql-chat
group: g3-edge
name: SQL 问答 · 边界情况：空 / 单行 / 极值
description: 空 CSV、仅表头、单行单列、极大数值、空 JSON 数组等边界输入下的稳定产出（离线 --sql）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g3-edge-1
    title: 边界输入：空 CSV
    tags:
      - edge
      - offline
    repeat: 5
    input:
      kind: table
      goal: 边界输入也要产出可读报告，不允许崩溃
      content: 请用中文回答这个数据问题，并给出只读 SQL 与结果表。
      files:
        - path: input/data.csv
          content: ""
        - path: input/extra.csv
          content: "k,v\n1,2\n"
      params:
        src: input/data.csv
        q: 空数据文件
        sql: SELECT COUNT(*) AS cnt FROM data
        limit: "200"
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: sql-chat 查询结果
          weight: 2
          note: 边界输入仍产出报告
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: regex
          pattern: 查询未执行完成|未产生结果
          weight: 2
          note: 边界处理结果符合预期
        - type: min_length
          value: 100
          weight: 1
          note: 报告不是空壳
      requiredSuggestions: []
