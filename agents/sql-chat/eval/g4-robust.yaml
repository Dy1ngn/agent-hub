id: ts-b-sql-chat-g4-robust
agentId: sql-chat
group: g4-robust
name: SQL 问答 · 鲁棒性：坏数据源与非法 SQL
description: 畸形 CSV、坏 JSON、NUL、写操作 SQL、多语句、坏列名、非法参数等异常输入下优雅拒绝不崩溃（离线 --sql）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g4-robust-1
    title: 异常输入：列数不齐 CSV
    tags:
      - robust
      - offline
    repeat: 5
    input:
      kind: table
      goal: 异常输入不能让工具崩溃：要么正常查询，要么优雅拒绝
      content: 请用中文回答这个数据问题，并给出只读 SQL 与结果表。
      files:
        - path: input/data.csv
          content: "id,city\n1,北京,extra\n2\n3,上海\n"
        - path: input/extra.csv
          content: "k,v\n1,2\n"
      params:
        src: input/data.csv
        q: 列数不齐
        sql: SELECT * FROM data
        limit: "200"
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: sql-chat 查询结果
          weight: 2
          note: 异常输入仍产出报告
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: regex
          pattern: 查询结果|查询未执行完成
          weight: 2
          note: 优雅处理结果符合预期
        - type: min_length
          value: 100
          weight: 1
          note: 报告不是空壳
      requiredSuggestions: []
