id: ts-b-prompt-optimizer-g1-basic
agentId: prompt-optimizer
group: g1-basic
name: 提示词优化 · 基础功能：典型提示词体检与优化
description: 模糊词/缺要素/占位符/完整五要素/中英文等典型提示词，走「确定性体检 + 评分卡 + 模型优化」完整链路（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-basic-1
    title: 提示词体检：样本 1
    tags:
      - prompt
    repeat: 10
    input:
      kind: text
      goal: 对典型提示词做确定性体检并给出优化版本
      content: 帮我写一个大概能用的登录接口，要快一点，尽量安全，最好支持很多用户，输出个代码就行。
      files: []
      params:
        goal: 优化这段提示词
        style: 详细
    gold:
      findings: []
      checks:
        - type: contains
          text: 提示词体检与优化报告
          weight: 2
          note: 产出标准体检报告
        - type: contains
          text: "## 三、评分卡"
          weight: 1
        - type: contains
          text: 「大概」
          weight: 2
          note: 确定性体检结论命中
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 400
          weight: 1
      requiredSuggestions: []
