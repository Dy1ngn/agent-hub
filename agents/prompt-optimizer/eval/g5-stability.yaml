id: ts-b-prompt-optimizer-g5-stability
agentId: prompt-optimizer
group: g5-stability
name: 提示词优化 · 稳定性：同输入重复调用
description: 10 个样本各重复调用 10 次（离线确定性模式），验证五要素判定、模糊词识别与评分稳定一致（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性重复：样本 1
    tags:
      - prompt
    repeat: 10
    input:
      kind: text
      goal: 重复调用验证体检结论稳定
      content: 帮我写一份周报模板，涵盖进度、风险、下周计划三部分，给出若干条示例条目，输出 Markdown，字数不超过 300。
      files: []
      params:
        goal: 稳定性测试
        style: 详细
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 提示词体检与优化报告
          weight: 2
          note: 产出标准体检报告
        - type: contains
          text: "## 三、评分卡"
          weight: 1
        - type: contains
          text: 「若干」
          weight: 2
          note: 确定性体检结论稳定
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
