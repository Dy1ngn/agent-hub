id: ts-b-dependency-auditor-g3-edge
agentId: dependency-auditor
group: g3-edge
name: 依赖审计 · 边界情况：空 / 极小 / 极大清单
description: 空清单、单包、超长约束、30 包大清单、缺失引用等边界输入下的稳定产出（离线模式）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g3-edge-1
    title: 边界输入：空清单
    tags:
      - edge
      - offline
    repeat: 5
    input:
      kind: text
      goal: 边界输入也要产出可读审计报告
      content: 请审计 input/deps 目录下的依赖清单，给出风险与升级建议。
      files:
        - path: input/deps/requirements.txt
          content: ""
        - path: input/deps/NOTES.txt
          content: "（占位文件，不是依赖清单）\n"
        - path: input/deps/README.md
          content: "（占位文件，不是依赖清单）\n"
        - path: input/advisory.json
          content: "[]"
      params:
        level: 提示
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 依赖风险审计报告
          weight: 2
          note: 边界输入仍产出报告
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: regex
          pattern: 没有解析出任何依赖|解析备注
          weight: 2
          note: 边界处理结果符合预期
        - type: min_length
          value: 200
          weight: 1
          note: 报告不是空壳
      requiredSuggestions: []
