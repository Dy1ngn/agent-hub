id: ts-b-dependency-auditor-g1-basic
agentId: dependency-auditor
group: g1-basic
name: 依赖审计 · 基础功能：典型依赖风险审计
description: 无版本约束、typosquat、过旧版本、git 依赖、许可证、约束冲突等典型风险，走完整「规则扫描 + 模型升级建议」链路（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-clean-1
    title: 干净依赖集（标准）
    tags:
      - basic
      - clean
    repeat: 5
    input:
      kind: text
      goal: 确认规范依赖集没有风险
      content: 请审计 input/deps 目录下的依赖清单，给出风险与升级建议。
      files:
        - path: input/deps/requirements.txt
          content: "requests==2.32.3\nflask==3.0.3\n"
        - path: input/deps/NOTES.txt
          content: "（占位文件，不是依赖清单）\n"
        - path: input/deps/README.md
          content: "（占位文件，不是依赖清单）\n"
        - path: input/advisory.json
          content: "[]"
      params:
        level: 提示
    gold:
      findings: []
      checks:
        - type: contains
          text: 依赖风险审计报告
          weight: 1
          note: 产出标准审计报告
        - type: contains
          text: "## 概览"
          weight: 1
          note: 报告固定结构（概览小节）
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: min_length
          value: 300
          weight: 1
          note: 报告不是空壳
        - type: regex
          pattern: 没有达到
          weight: 2
          note: 干净依赖集无命中项
      requiredSuggestions: []
