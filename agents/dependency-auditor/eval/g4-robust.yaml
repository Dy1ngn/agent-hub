        - path: input/deps/pyproject.toml
          content: '[project

            name = "x"

            '
        - path: input/deps/requirements.txt
          content: "requests==2.32.3\nflask==3.0.3\n"
        - path: input/deps/README.md
          content: "（占位文件，不是依赖清单）\n"
        - path: input/advisory.json
          content: "[]"
      params:
        level: 提示
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 依赖风险审计报告
          weight: 2
          note: 异常输入仍产出报告
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: regex
          pattern: 概览|逐包明细
          weight: 2
          note: 优雅处理结果符合预期
        - type: min_length
          value: 200
          weight: 1
          note: 报告不是空壳
      requiredSuggestions: []
