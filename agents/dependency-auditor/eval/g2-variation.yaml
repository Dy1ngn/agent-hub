id: ts-b-dependency-auditor-g2-variation
agentId: dependency-auditor
group: g2-variation
name: 依赖审计 · 输入变体：清单类型 / 规模 / 参数
description: Pipfile、dev 清单、extras/环境标记、过宽约束、级别过滤、公告匹配、大清单、多清单等变体（模型链路）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g2-pipfile-1
    title: Pipfile / Pipfile.lock（Pipfile）
    tags:
      - variation
      - format
    repeat: 5
    input:
      kind: text
      goal: 解析 Pipfile 系列清单
      content: 请审计 input/deps 目录下的依赖清单，给出风险与升级建议。
      files:
        - path: input/deps/Pipfile
          content: '[[source]]

            url = "https://pypi.org/simple"


            [packages]

            requests = "==2.31.0"

            flask = "*"

            '
        - path: input/deps/NOTES.txt
          content: "（占位文件，不是依赖清单）\n"
        - path: input/deps/README.md
          content: "（占位文件，不是依赖清单）\n"
        - path: input/advisory.json
          content: "[]"
      params:
        level: 提示
    gold:
      findings: []
      checks:
        - type: contains
          text: 依赖风险审计报告
          weight: 1
          note: 产出标准审计报告
        - type: contains
          text: "## 概览"
          weight: 1
          note: 报告固定结构（概览小节）
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: min_length
          value: 300
          weight: 1
          note: 报告不是空壳
        - type: contains
          text: 逐包明细
          weight: 1
          note: 逐包给出审计明细
        - type: regex
          pattern: (?i)pipfile
          weight: 1
          note: 识别 Pipfile 系列
      requiredSuggestions: []
