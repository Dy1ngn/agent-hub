id: ts-b-dependency-auditor-g5-stability
agentId: dependency-auditor
group: g5-stability
name: 依赖审计 · 稳定性：同输入重复调用
description: 10 个确定性样本（9 条规则 + 干净集 + 公告命中）各重复调用 10 次（离线模式）（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性重复：DA001 无版本约束
    tags:
      - stability
      - offline
    repeat: 10
    input:
      kind: text
      goal: 同一输入重复调用 10 次，确定性结论应稳定出现
      content: 请审计 input/deps 目录下的依赖清单，给出风险与升级建议。
      files:
        - path: input/deps/requirements.txt
          content: "requests\n"
        - path: input/deps/NOTES.txt
          content: "（占位文件，不是依赖清单）\n"
        - path: input/deps/README.md
          content: "（占位文件，不是依赖清单）\n"
        - path: input/advisory.json
          content: "[]"
      params:
        level: 提示
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 依赖风险审计报告
          weight: 2
          note: 重复调用仍产出报告
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: regex
          pattern: \| (提示|警告|风险) \| DA001
          weight: 2
          note: 规则命中稳定出现
        - type: contains
          text: 声明了 requests 但没写版本约束
          weight: 2
          note: 断言确定性细节
        - type: min_length
          value: 300
          weight: 1
          note: 报告不是空壳
      requiredSuggestions: []
