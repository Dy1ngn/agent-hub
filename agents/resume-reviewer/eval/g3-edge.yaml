id: ts-b-resume-reviewer-g3-edge
agentId: resume-reviewer
group: g3-edge
name: 简历诊断 · 边界情况：空 / 极短 / 极多 / 极端参数
description: 空简历、极短简历、40 条要点、纯表格、超长参数等边界输入下的稳定产出（离线确定性模式）（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g3-edge-1
    title: 边界输入：空简历 + 空 JD
    tags:
      - edge
      - offline
    repeat: 10
    input:
      kind: text
      goal: 边界输入也要产出完整诊断报告，不允许崩溃
      content: 边界用例：空简历 + 空 JD
      files:
        - path: input/empty-resume.md
          content: ""
        - path: input/jd.txt
          content: ""
      params:
        offline: true
        role: 软件工程师
        resume: input/empty-resume.md
    gold:
      findings: []
      checks:
        - type: contains
          text: 简历诊断报告
          weight: 2
          note: 边界输入仍产出报告
        - type: contains
          text: 评分卡
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: not_contains
          text: SyntaxError
          weight: 1
        - type: min_length
          value: 500
          weight: 1
      requiredSuggestions: []
