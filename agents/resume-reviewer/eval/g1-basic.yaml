id: ts-b-resume-reviewer-g1-basic
agentId: resume-reviewer
group: g1-basic
name: 简历诊断 · 基础功能：典型简历诊断
description: 典型中英文简历 + JD 的完整体检：结构、量化、JD 匹配、日期与联系方式，走「确定性体检 + 模型改写」链路（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-full-1
    title: 完整简历体检（数据分析师）
    tags:
      - basic
    repeat: 5
    input:
      kind: text
      goal: 对简历做全量体检并结合 JD 打分，产出中文 Markdown 诊断报告
      content: 请对 resume-da.md 做简历体检（目标岗位：数据分析师），生成诊断报告。
      files:
        - path: input/resume-da.md
          content: "# 张伟（数据分析师）


            手机：13800001234 ｜ 邮箱：zhangwei@example.com


            ## 工作经历


            ### 云图科技 · 数据分析师（2023.03 - 至今）

            - 负责日常业务数据报表

            - 搭建 SQL 指标体系，日报产出时间从 4 小时缩短到 30 分钟

            - 我参与了用户增长分析项目


            ### 星辰数据 · 数据实习生（2022.06 - 2022.12）

            - 协助清洗用户行为数据

            - 用 Python 做留存分析，输出 3 份周报


            ## 教育背景

            - 华东理工大学 · 统计学 · 本科（2019-2023）


            ## 技能

            - Python、SQL、Excel、Tableau\n"
        - path: input/jd.txt
          content: "职位：数据分析师

            职责：负责业务数据分析与指标体系建设，输出可视化分析报告。

            要求：

            - 熟练使用 SQL 完成复杂取数

            - 熟悉 Python 数据分析（pandas）

            - 掌握 Tableau 或同类 BI 工具

            - 有 A/B 实验经验优先\n"
      params:
        role: 数据分析师
        resume: input/resume-da.md
    gold:
      findings: []
      checks:
        - type: contains
          text: 简历诊断报告
          weight: 1
          note: 产出标准报告
        - type: contains
          text: 评分卡
          weight: 1
          note: 四维评分卡
        - type: contains
          text: 数据分析师
          weight: 2
          note: 目标岗位写进报告
        - type: contains
          text: SQL
          weight: 2
          note: JD 技能出现在匹配分析
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 1500
          weight: 1
      requiredSuggestions: []
