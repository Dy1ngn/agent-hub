id: ts-b-resume-reviewer-g2-variation
agentId: resume-reviewer
group: g2-variation
name: 简历诊断 · 输入变体：语言 / 长度 / 岗位 / JD 形态
description: 中英混合、emoji、表格、极短极长简历与各类 JD 形态下的稳定诊断（模型改写链路）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g2-lang-1
    title: 语言与排版变体（resume-cn.md）
    tags:
      - variation
      - language
    repeat: 5
    input:
      kind: text
      goal: 不同语言与排版形态的简历都要产出稳定报告
      content: 请体检 resume-cn.md（目标岗位：后端开发工程师）。
      files:
        - path: input/resume-cn.md
          content: "# 刘洋


            ## 工作经历

            ### 云启科技 · 后端工程师（2021.04 - 至今）

            - 负责用户中心服务开发

            - 重构鉴权模块，接口错误率从 1% 降到 0.1%


            ## 教育背景

            - 四川大学 · 计算机 · 本科（2017-2021）


            ## 技能

            - Python、Django、PostgreSQL\n"
        - path: input/jd.txt
          content: "职位：全栈工程师

            职责：负责业务系统研发与迭代。

            要求：熟练 Python 或 Java，熟悉 SQL 与主流框架，具备良好的工程习惯。\n"
      params:
        role: 后端开发工程师
        resume: input/resume-cn.md
    gold:
      findings: []
      checks:
        - type: contains
          text: 简历诊断报告
          weight: 1
        - type: contains
          text: resume-cn.md
          weight: 2
          note: 报告标注简历文件
        - type: contains
          text: 问题清单
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 800
          weight: 1
      requiredSuggestions: []
