id: ts-b-resume-reviewer-g4-robust
agentId: resume-reviewer
group: g4-robust
name: 简历诊断 · 鲁棒性：乱码 / 控制字符 / 缺字段
description: 乱码、控制字符、零宽字符、缺字段与畸形参数下优雅处理不崩溃（离线确定性模式）（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g4-robust-1
    title: 异常输入：乱码简历
    tags:
      - robust
      - offline
    repeat: 10
    input:
      kind: text
      goal: 异常输入不能让工具崩溃，仍要产出报告
      content: 异常用例：乱码简历
      files:
        - path: input/mojibake.md
          content: "# ��简历�\n\n## 工作�历\n- �����数据��\n"
        - path: input/jd.txt
          content: "职位：全栈工程师

            职责：负责业务系统研发与迭代。

            要求：熟练 Python 或 Java，熟悉 SQL 与主流框架，具备良好的工程习惯。\n"
      params:
        offline: true
        role: 软件工程师
        resume: input/mojibake.md
    gold:
      findings: []
      checks:
        - type: contains
          text: 简历诊断报告
          weight: 2
          note: 异常输入仍产出报告
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: contains
          text: 问题清单
          weight: 1
        - type: min_length
          value: 500
          weight: 1
      requiredSuggestions: []
