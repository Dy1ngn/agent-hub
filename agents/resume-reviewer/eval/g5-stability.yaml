id: ts-b-resume-reviewer-g5-stability
agentId: resume-reviewer
group: g5-stability
name: 简历诊断 · 稳定性：同输入重复调用
description: 10 个样本各重复 10 次（离线确定性模式），验证输出稳定、结构一致、不崩溃（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性重复：s1-da.md
    tags:
      - stability
      - offline
    repeat: 10
    input:
      kind: text
      goal: 重复调用验证输出稳定
      content: 稳定性样本 1：s1-da.md（目标岗位：数据分析师）
      files:
        - path: input/s1-da.md
          content: "# 张伟（数据分析师）


            手机：13800001234 ｜ 邮箱：zhangwei@example.com


            ## 工作经历


            ### 云图科技 · 数据分析师（2023.03 - 至今）

            - 负责日常业务数据报表

            - 搭建 SQL 指标体系，日报产出时间从 4 小时缩短到 30 分钟

            - 我参与了用户增长分析项目


            ### 星辰数据 · 数据实习生（2022.06 - 2022.12）

            - 协助清洗用户行为数据

            - 用 Python 做留存分析，输出 3 份周报


            ## 教育背景

            - 华东理工大学 · 统计学 · 本科（2019-2023）


            ## 技能

            - Python、SQL、Excel、Tableau\n"
        - path: input/jd.txt
          content: "职位：数据分析师

            职责：负责业务数据分析与指标体系建设，输出可视化分析报告。

            要求：

            - 熟练使用 SQL 完成复杂取数

            - 熟悉 Python 数据分析（pandas）

            - 掌握 Tableau 或同类 BI 工具

            - 有 A/B 实验经验优先\n"
      params:
        offline: true
        role: 数据分析师
        resume: input/s1-da.md
    gold:
      findings: []
      checks:
        - type: contains
          text: 简历诊断报告
          weight: 2
        - type: contains
          text: s1-da.md
          weight: 2
          note: 确定性输出身份一致
        - type: not_contains
          text: Traceback
          weight: 2
        - type: min_length
          value: 800
          weight: 1
      requiredSuggestions: []
