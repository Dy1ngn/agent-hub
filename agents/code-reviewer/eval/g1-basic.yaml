id: ts-b-code-reviewer-g1-basic
agentId: code-reviewer
group: g1-basic
name: 代码审查 · 基础功能：典型缺陷代码审查
description: 常见真实缺陷（安全/并发/性能/资源泄漏/吞异常等）的典型输入，走完整「静态规则 + 模型语义审查」链路（20 条用例 / 100 次调用）
judge:
  enabled: true
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-sqli
    title: SQL 拼接注入（python）
    tags:
      - security
      - basic
    repeat: 5
    input:
      kind: code
      goal: 审查这段代码里的高置信问题，尤其是安全问题
      content: 请审查 input/ 目录下的代码，找出安全与可靠性问题。
      files:
        - path: input/app.py
          content: "import sqlite3


            def find_user(name):

            \    conn = sqlite3.connect('app.db')

            \    cur = conn.cursor()

            \    cur.execute(\"SELECT * FROM users WHERE name = '\" + name + \"'\")

            \    return cur.fetchall()\n"
      params: {}
    gold:
      findings: []
      checks:
        - type: contains
          text: 代码审查报告
          weight: 1
          note: 产出标准报告
        - type: regex
          pattern: (?i)(sql|注入|injection|拼接)
          weight: 2
          note: 识别出 SQL 注入风险
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
