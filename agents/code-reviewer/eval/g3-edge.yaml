id: ts-b-code-reviewer-g3-edge
agentId: code-reviewer
group: g3-edge
name: 代码审查 · 边界情况：极小 / 空 / 特殊内容
description: 空文件、单行、纯注释、超长行、纯数据文件等边界输入下的稳定产出（离线静态模式）（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g3-edge-1
    title: 边界输入：空文件
    tags:
      - edge
      - offline
    repeat: 10
    input:
      kind: code
      goal: 对边界输入也要产出报告
      content: 边界用例：空文件
      files:
        - path: input/edge1.py
          content: ""
      params:
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 代码审查报告
          weight: 2
          note: 边界输入仍产出报告
        - type: not_contains
          text: Traceback
          weight: 1
        - type: not_contains
          text: SyntaxError
          weight: 1
      requiredSuggestions: []
  - id: g3-edge-2
    title: 边界输入：单字符文件
    tags:
      - edge
      - offline
    repeat: 10
    input:
      kind: code
      goal: 对边界输入也要产出报告
      content: 边界用例：单字符文件
      files:
        - path: input/edge2.py
          content: x
      params:
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 代码审查报告
          weight: 2
          note: 边界输入仍产出报告
        - type: not_contains
          text: Traceback
          weight: 1
        - type: not_contains
          text: SyntaxError
          weight: 1
