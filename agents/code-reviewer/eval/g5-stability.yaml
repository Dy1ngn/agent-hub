id: ts-b-code-reviewer-g5-stability
agentId: code-reviewer
group: g5-stability
name: 代码审查 · 稳定性：同输入重复调用
description: 10 个样本各重复调用 10 次（离线静态模式），验证输出稳定、不崩溃、结构一致（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性重复：样本 1
    tags:
      - stability
      - offline
    repeat: 10
    input:
      kind: code
      goal: 重复调用验证稳定性
      content: 稳定性样本 1
      files:
        - path: input/stable1.py
          content: "import os


            def read_config(path):

            \    f = open(path)

            \    data = f.read()

            \    return eval(data)\n"
      params:
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 代码审查报告
          weight: 2
        - type: not_contains
          text: Traceback
          weight: 2
        - type: min_length
          value: 300
          weight: 1
        - type: regex
          pattern: (问题|风险|警告|建议|严重)
          weight: 1
      requiredSuggestions: []
