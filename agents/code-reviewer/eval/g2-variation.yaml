  - id: g2-big-1
    title: 较大文件审查（1）
    tags:
      - variation
      - scale
    repeat: 10
    input:
      kind: code
      goal: 审查较长文件里的问题
      content: 文件较长，关注高置信问题。
      files:
        - path: input/big1.py
          content: "import os


            CONFIG = {}


            def init_config():

            \    for line in open('config.ini'):

            \        k, v = line.split('=')

            \        CONFIG[k] = v


            def get(key):

            \    return CONFIG[key]


            def dump():

            \    return eval(open('state.txt').read())


            def save_state(state):

            \    f = open('state.txt', 'w')

            \    f.write(repr(state))


            def run_cmd(cmd):

            \    os.system('tool ' + cmd)


            def batch_run(cmds):

            \    for c in cmds:

            \        run_cmd(c)


            def report(items):

            \    out = []

            \    for i in items:

            \        out.append(str(i))

            \    return '\\n'.join(out)\n"
      params: {}
    gold:
      findings: []
