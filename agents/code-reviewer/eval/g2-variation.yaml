id: ts-b-code-reviewer-g2-variation
agentId: code-reviewer
group: g2-variation
name: 代码审查 · 输入变体：语言 / 规模 / 内容形态
description: 不同语言与文件规模下的表现：多文件、大文件、混合语言、注释密度等变体（模型语义审查链路）（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g2-multi-1
    title: 多文件混合审查（1）
    tags:
      - variation
      - multi-file
    repeat: 10
    input:
      kind: code
      goal: 审查这批文件里的高置信问题
      content: 多文件审查样本 1
      files:
        - path: input/service1.py
          content: "def load(path):

            \    f = open(path)

            \    return eval(f.read())\n"
        - path: input/util1.js
          content: "module.exports = { run: (cmd) => require('child_process').execSync('ls ' + cmd).toString() };\n"
      params: {}
    gold:
      findings: []
      checks:
        - type: contains
          text: 代码审查报告
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 300
          weight: 1
        - type: regex
          pattern: (问题|风险|建议|严重|警告)
          weight: 1
          note: 报告包含问题类描述
      requiredSuggestions: []
