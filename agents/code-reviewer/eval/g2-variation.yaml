          content: "import json


            HANDLERS = {}


            def register(name):

            \    def deco(fn):

            \        HANDLERS[name] = fn

            \        return fn

            \    return deco


            @register('ping')

            def ping(payload):

            \    return {'pong': payload}


            def dispatch(raw):

            \    data = json.loads(raw)

            \    return HANDLERS[data['type']](data['payload'])


            def handle_all(raws):

            \    out = []

            \    for raw in raws:

            \        try:

            \            out.append(dispatch(raw))

            \        except Exception:

            \            pass

            \    return out\n"
