      files:
        - path: input/big2.py
          content: "class Repo:

            \    def __init__(self):

            \        self.cache = {}

            \    def get(self, key):

            \        return self.cache[key].lower()

            \    def put(self, key, value):

            \        self.cache[key] = value

            \    def bulk(self, pairs):

            \        for p in pairs:

            \            self.put(p[0], p[1])

            \    def search(self, needle):

            \        out = []

            \        for k in self.cache:

            \            if needle in self.cache[k]:

            \                out.append(k)

            \        return out

            \    def export(self, path):

            \        f = open(path, 'w')

            \        f.write(str(self.cache))\n"
      params: {}
