id: ts-b-code-reviewer-g4-robust
agentId: code-reviewer
group: g4-robust
name: 代码审查 · 鲁棒性：畸形 / 编码异常输入
description: 乱码、控制字符、零宽字符、损坏语法等异常输入下不崩溃、优雅降级（离线静态模式）（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g4-robust-1
    title: 异常输入：语法损坏
    tags:
      - robust
      - offline
    repeat: 10
    input:
      kind: code
      goal: 异常输入不能让工具崩溃
      content: 异常用例：语法损坏
      files:
        - path: input/bad1.py
          content: "def broken(:\n    pass\n@@@ ###\n"
      params:
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 代码审查报告
          weight: 2
          note: 异常输入仍产出报告
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: not_contains
          text: SyntaxError
          weight: 1
      requiredSuggestions: []
