id: ts-b-weekly-report-g5-stability
agentId: weekly-report
group: g5-stability
name: 周报日报 · 稳定性：10 样本 × 重复 10 次
description: 10 个确定性样本各重复 10 次，离线输出必须完全一致（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: "稳定性样本（feat: 新增支付回调接口）"
    tags:
      - stability
      - offline
    repeat: 10
    input:
      kind: text
      goal: 同输入重复运行，输出应完全一致
      content: 请生成报告。
      files:
        - path: input/notes.md
          content: "# 工作记录


            ## 2026-10-27

            - [x] 完成支付模块联调

            - [ ] 继续补齐单元测试


            ## 2026-10-28

            - [x] 排查线上慢查询问题

            - [ ] 输出对接文档\n"
        - path: input/commits.txt
          content: "# 日期 | 提交说明 | +新增 -删除 | 文件

            2026-10-27 | feat: 新增支付回调接口 | +156 -24 | src/pay/callback.py,src/pay/api.py

            2026-10-28 | fix: 修复金额计算精度 | +38 -12 | src/pay/calc.py\n"
      params:
        report_type: weekly
        days: "7"
        offline: true
    gold:
      findings: []
      checks:
        - type: regex
          pattern: "# 工作(周报|日报)"
          weight: 1
        - type: contains
          text: "feat: 新增支付回调接口"
          weight: 2
          note: commit 说明回显
        - type: contains
          text: 完成支付模块联调
          weight: 1
          note: 工作记录回显
        - type: contains
          text: "### 数量汇总"
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
