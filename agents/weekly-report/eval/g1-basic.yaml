id: ts-b-weekly-report-g1-basic
agentId: weekly-report
group: g1-basic
name: 周报日报 · 基础功能：git + 工作记录周报
description: 典型提交与工作记录输入，走完整「采集 + 模型生成」链路（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-feat-1
    title: "功能提交 + 工作记录（feat: 新增支付回调接口）"
    tags:
      - basic
      - git
    repeat: 5
    input:
      kind: text
      goal: 生成周报：git 提交 + 工作记录合并
      content: 请生成工作周报。
      files:
        - path: input/notes.md
          content: "# 工作记录


            ## 2026-10-27

            - [x] 完成支付模块联调

            - [ ] 继续补齐单元测试


            ## 2026-10-28

            - [x] 排查线上慢查询问题

            - [ ] 输出对接文档\n"
        - path: input/commits.txt
          content: "# 日期 | 提交说明 | +新增 -删除 | 文件

            2026-10-27 | feat: 新增支付回调接口 | +156 -24 | src/pay/callback.py,src/pay/api.py

            2026-10-28 | fix: 修复金额计算精度 | +38 -12 | src/pay/calc.py\n"
      params:
        report_type: weekly
        days: "7"
    gold:
      findings: []
      checks:
        - type: contains
          text: "feat: 新增支付回调接口"
          weight: 2
          note: commit 说明回显在数据附录
        - type: contains
          text: "## 本周完成"
          weight: 1
        - type: regex
          pattern: "# 工作(周报|日报)"
          weight: 2
          note: 报告固定标题
        - type: contains
          text: "### 数量汇总"
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 400
          weight: 1
      requiredSuggestions: []
