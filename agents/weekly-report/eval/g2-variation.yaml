id: ts-b-weekly-report-g2-variation
agentId: weekly-report
group: g2-variation
name: 周报日报 · 输入变体：窗口 / 提交量 / 记录格式 / 参数
description: 统计窗口、提交量、工作记录格式与报告类型参数变体，走模型链路（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g2-windows-1
    title: 统计窗口变体（7 天）
    tags:
      - variation
      - window
    repeat: 5
    input:
      kind: text
      goal: 不同统计窗口的报告
      content: 请生成报告。
      files:
        - path: input/notes.md
          content: "# 工作记录


            ## 2026-10-27

            - [x] 完成支付模块联调

            - [ ] 继续补齐单元测试


            ## 2026-10-28

            - [x] 排查线上慢查询问题

            - [ ] 输出对接文档\n"
        - path: input/commits.txt
          content: "# 日期 | 提交说明 | +新增 -删除 | 文件

            2026-10-27 | feat: 新增支付回调接口 | +156 -24 | src/pay/callback.py,src/pay/api.py

            2026-10-28 | fix: 修复金额计算精度 | +38 -12 | src/pay/calc.py\n"
      params:
        report_type: weekly
        days: "7"
    gold:
      findings: []
      checks:
        - type: contains
          text: "feat: 新增支付回调接口"
          weight: 2
        - type: contains
          text: "### 每日分布"
          weight: 1
        - type: regex
          pattern: "# 工作(周报|日报)"
          weight: 2
          note: 报告固定标题
        - type: contains
          text: "### 数量汇总"
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 400
          weight: 1
      requiredSuggestions: []
