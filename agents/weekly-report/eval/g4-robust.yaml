id: ts-b-weekly-report-g4-robust
agentId: weekly-report
group: g4-robust
name: 周报日报 · 鲁棒性：损坏行 / 乱码 / 缺字段
description: 损坏 commit 行、乱码、坏统计字段、畸形工作记录，优雅处理不崩溃（离线）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g4-broken-1
    title: "损坏 commit 行（feat: 兜底提交说明）"
    tags:
      - robust
      - offline
    repeat: 5
    input:
      kind: text
      goal: 损坏的 commit 列表不崩溃
      content: 请生成报告。
      files:
        - path: input/notes.md
          content: "# 工作记录


            ## 2026-10-28

            - [x] 兜底记录条目\n"
        - path: input/commits.txt
          content: "!!! 乱七八糟的行 !!!

            2026-10-28 | feat: 兜底提交说明 | +10 -2 | src/keep.py\n"
      params:
        report_type: weekly
        days: "7"
        offline: true
    gold:
      findings: []
      checks:
        - type: regex
          pattern: "# 工作(周报|日报)"
          weight: 2
        - type: contains
          text: "feat: 兜底提交说明"
          weight: 2
          note: 可解析的提交仍回显
        - type: not_contains
          text: Traceback
          weight: 1
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
