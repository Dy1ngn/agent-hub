      content: "季度复盘。这个季度我们其实做了很多事情，然后有些做得不错，有些也踩了坑，我简单总结一下。

        第一点，产品方面，新功能的上线节奏基本上是跟上了计划的，然后用户反馈也还行，但是留存数据我觉得还有提升空间。

        第二点，技术方面，我们完成了服务拆分，然后把历史的坏账清掉了一部分，反正技术债这个事情急不来，慢慢还吧。

        第三点，团队方面，新人的成长速度挺快的，然后老同学也都比较稳定，我觉得氛围不错。

        第四点，下季度的计划，主要是围绕增长来做，然后把体验再打磨一下，基本上就是这两个方向。

        总之，这个季度算是平稳落地，然后下季度继续加油。\n"
