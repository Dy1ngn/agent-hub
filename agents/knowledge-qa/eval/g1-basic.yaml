id: ts-b-knowledge-qa-g1-basic
agentId: knowledge-qa
group: g1-basic
name: 知识库问答 · 基础功能：典型知识库问答
description: 安装/配置/部署/排障/价格/接口/制度等典型问题与无命中兜底（检索 + 模型回答链路）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g1-install-1
    title: 安装问题（标准问法）
    tags:
      - basic
      - kb
    repeat: 5
    input:
      kind: text
      goal: 回答安装相关问题
      content: 请根据本地知识库回答问题，并给出来源引用。
      files:
        - path: kb/guide.md
          content: "# 产品安装指南


            ## 依赖安装


            使用 pip install -r requirements.txt 安装依赖，建议先创建虚拟环境再安装。


            ## 虚拟环境


            推荐用 python3 -m venv 创建虚拟环境。\n"
        - path: kb/faq.md
          content: "# 常见问题


            ## 服务启动失败


            服务启动失败时先检查端口占用，再查看日志文件 error.log。


            ## 忘记密码


            忘记密码请联系管理员重置密码。\n"
        - path: kb/notes.md
          content: "# 杂记\n\n随便写点无关内容，用于干扰检索。\n"
      params:
        q: 如何安装依赖？
        topk: "5"
        minscore: "0.5"
    gold:
      findings: []
      checks:
        - type: contains
          text: 知识库问答报告
          weight: 1
          note: 产出标准问答报告
        - type: contains
          text: "## 引用清单"
          weight: 1
          note: 报告固定结构（引用清单）
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: min_length
          value: 200
          weight: 1
          note: 报告不是空壳
        - type: regex
          pattern: (安装|pip|requirements)
          weight: 2
          note: 命中安装指南
      requiredSuggestions: []
