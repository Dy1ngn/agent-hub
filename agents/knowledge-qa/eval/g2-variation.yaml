id: ts-b-knowledge-qa-g2-variation
agentId: knowledge-qa
group: g2-variation
name: 知识库问答 · 输入变体：参数 / 文档形态 / 规模
description: top-k、min-score、超长文档、标题层级、txt/json/csv 知识库、10 篇文档、同义词扩展等变体（模型链路）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g2-topk-1
    title: 检索片段数（top-k=3）
    tags:
      - variation
      - params
    repeat: 5
    input:
      kind: text
      goal: 验证 top-k 参数
      content: 请根据本地知识库回答问题，并给出来源引用。
      files:
        - path: kb/guide.md
          content: "# 产品安装指南


            ## 依赖安装


            使用 pip install -r requirements.txt 安装依赖，建议先创建虚拟环境再安装。


            ## 虚拟环境


            推荐用 python3 -m venv 创建虚拟环境。\n"
        - path: kb/faq.md
          content: "# 常见问题


            ## 服务启动失败


            服务启动失败时先检查端口占用，再查看日志文件 error.log。


            ## 忘记密码


            忘记密码请联系管理员重置密码。\n"
        - path: kb/notes.md
          content: "# 杂记\n\n随便写点无关内容，用于干扰检索。\n"
      params:
        q: 安装依赖怎么安装？
        topk: "3"
        minscore: "0.5"
    gold:
      findings: []
      checks:
        - type: contains
          text: 知识库问答报告
          weight: 1
          note: 产出标准问答报告
        - type: contains
          text: "## 引用清单"
          weight: 1
          note: 报告固定结构（引用清单）
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: min_length
          value: 200
          weight: 1
          note: 报告不是空壳
        - type: regex
          pattern: (检索片段数|片段)
          weight: 2
          note: 按 top-k 返回片段
      requiredSuggestions: []
