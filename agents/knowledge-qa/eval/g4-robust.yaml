id: ts-b-knowledge-qa-g4-robust
agentId: knowledge-qa
group: g4-robust
name: 知识库问答 · 鲁棒性：坏知识库与非法参数
description: 坏 JSON、乱码、NUL、隐藏目录、非法 top-k/阈值、目录缺失等异常输入下优雅处理不崩溃（离线检索）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g4-robust-1
    title: 异常输入：坏 JSON 知识库文件
    tags:
      - robust
      - offline
    repeat: 5
    input:
      kind: text
      goal: 异常输入不能让工具崩溃：要么正常检索，要么优雅报错
      content: 请根据本地知识库回答问题，并给出来源引用。
      files:
        - path: kb/guide.md
          content: "# 产品安装指南


            ## 依赖安装


            使用 pip install -r requirements.txt 安装依赖，建议先创建虚拟环境再安装。


            ## 虚拟环境


            推荐用 python3 -m venv 创建虚拟环境。\n"
        - path: kb/bad.json
          content: "{bad json"
        - path: kb/notes.md
          content: "# 杂记\n\n随便写点无关内容，用于干扰检索。\n"
      params:
        q: 安装依赖怎么做？
        topk: "5"
        minscore: "0.5"
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 知识库问答报告
          weight: 2
          note: 异常输入仍产出报告
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: regex
          pattern: 片段|检索得分表
          weight: 2
          note: 优雅处理结果符合预期
        - type: min_length
          value: 120
          weight: 1
          note: 报告不是空壳
      requiredSuggestions: []
