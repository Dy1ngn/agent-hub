id: ts-b-knowledge-qa-g5-stability
agentId: knowledge-qa
group: g5-stability
name: 知识库问答 · 稳定性：同问题重复检索
description: 10 个确定性问题各重复调用 10 次（离线检索），断言片段、来源与得分表稳定一致（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性重复：命中片段排序
    tags:
      - stability
      - offline
    repeat: 10
    input:
      kind: text
      goal: 同一问题重复检索 10 次，报告结构与来源应稳定一致
      content: 请根据本地知识库回答问题，并给出来源引用。
      files:
        - path: kb/guide.md
          content: "# 产品安装指南


            ## 依赖安装


            使用 pip install -r requirements.txt 安装依赖，建议先创建虚拟环境再安装。


            ## 虚拟环境


            推荐用 python3 -m venv 创建虚拟环境。\n"
        - path: kb/faq.md
          content: "# 常见问题


            ## 服务启动失败


            服务启动失败时先检查端口占用，再查看日志文件 error.log。


            ## 忘记密码


            忘记密码请联系管理员重置密码。\n"
        - path: kb/notes.md
          content: "# 杂记\n\n随便写点无关内容，用于干扰检索。\n"
      params:
        q: 如何安装依赖？
        topk: "5"
        minscore: "0.5"
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 知识库问答报告
          weight: 2
          note: 重复调用仍产出报告
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: regex
          pattern: 片段
          weight: 2
          note: 检索结论稳定出现
        - type: contains
          text: "### 片段 1："
          weight: 2
          note: 断言确定性细节
        - type: min_length
          value: 150
          weight: 1
          note: 报告不是空壳
      requiredSuggestions: []
