id: ts-b-knowledge-qa-g3-edge
agentId: knowledge-qa
group: g3-edge
name: 知识库问答 · 边界情况：空 / 单行 / 极值
description: 空知识库、单字文档、超长段落、空格问题、繁体/英文问题等边界输入下的稳定产出（离线检索）（20 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g3-edge-1
    title: 边界输入：空知识库
    tags:
      - edge
      - offline
    repeat: 5
    input:
      kind: text
      goal: 边界输入也要产出可读报告，不允许崩溃
      content: 请根据本地知识库回答问题，并给出来源引用。
      files:
        - path: kb/empty.md
          content: ""
        - path: kb/.keep
          content: ""
        - path: kb/notes.md
          content: "# 杂记\n\n随便写点无关内容，用于干扰检索。\n"
      params:
        q: 有问题吗？
        topk: "5"
        minscore: "0.5"
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 知识库问答报告
          weight: 2
          note: 边界输入仍产出报告
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: regex
          pattern: 没有相关内容|片段
          weight: 2
          note: 边界检索结果符合预期
        - type: min_length
          value: 120
          weight: 1
          note: 报告不是空壳
      requiredSuggestions: []
  - id: g3-edge-2
    title: 边界输入：单字文档
    tags:
      - edge
      - offline
    repeat: 5
    input:
      kind: text
      goal: 边界输入也要产出可读报告，不允许崩溃
      content: 请根据本地知识库回答问题，并给出来源引用。
      files:
        - path: kb/one.md
          content: "安装\n"
        - path: kb/faq.md
          content: "# 常见问题


            ## 服务启动失败


            服务启动失败时先检查端口占用，再查看日志文件 error.log。


            ## 忘记密码


            忘记密码请联系管理员重置密码。\n"
        - path: kb/notes.md
          content: "# 杂记\n\n随便写点无关内容，用于干扰检索。\n"
      params:
        q: 安装依赖怎么做？
        topk: "5"
        minscore: "0.5"
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 知识库问答报告
          weight: 2
          note: 边界输入仍产出报告
        - type: not_contains
          text: Traceback
          weight: 2
          note: 不允许 Python 崩栈
        - type: regex
          pattern: 片段|没有相关内容
          weight: 2
          note: 边界检索结果符合预期
        - type: min_length
          value: 120
          weight: 1
          note: 报告不是空壳
      requiredSuggestions: []
