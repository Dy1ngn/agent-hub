id: ts-b-stock-analyst-g5-stability
agentId: stock-analyst
group: g5-stability
name: 股票分析 · 稳定性：同输入重复调用
description: 10 个行情样本各重复调用 10 次（规则链路），验证确定性输出与稳定性（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
cases:
  - id: g5-stable-1
    title: 稳定性重复：600519（up）
    tags:
      - stability
      - rule
    repeat: 10
    input:
      kind: json
      goal: 重复调用验证稳定性
      content: '{"symbol": "600519", "seed": 41, "trend": "up", "days": 120, "fund_score": 70, "sentiment": "正面"}'
      files: []
      params:
        offline: true
    gold:
      findings: []
      checks:
        - type: contains
          text: 股票分析报告
          weight: 2
        - type: contains
          text: "600519"
          weight: 1
        - type: regex
          pattern: 综合[评分]+[^\d]*\d+
          weight: 1
        - type: not_contains
          text: Traceback
          weight: 2
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
