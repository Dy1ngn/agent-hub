id: ts-b-todo-planner-g4-robust
agentId: todo-planner
group: g4-robust
name: 任务拆解 · 鲁棒性：乱码 / 控制字符 / 畸形目标文本
description: 乱码、控制字符、emoji、零宽字符、未闭合括号、重复与嵌套任务等异常输入下优雅处理不崩溃（离线确定性模式）（10 条用例 / 100 次调用）
judge:
  enabled: false
  rubric: review-quality
  weight: 0.3
