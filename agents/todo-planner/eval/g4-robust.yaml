  - id: g4-robust-1
    title: 异常输入：目标乱码
    tags:
      - robust
      - offline
    repeat: 10
    input:
      kind: text
      goal: 异常输入不能让工具崩溃，仍要产出计划
      content: 异常用例：目标乱码
      files:
        - path: input/goal.md
          content: ""
      params:
        offline: true
        goal: "��目标��\n- ��任务�"
        days: "30"
        start: 2026-11-02
        style: 稳妥
    gold:
      findings: []
      checks:
        - type: contains
          text: 目标拆解计划
          weight: 2
          note: 异常输入仍产出计划
        - type: not_contains
          text: Traceback
          weight: 2
        - type: contains
          text: 风险清单
          weight: 1
        - type: min_length
          value: 300
          weight: 1
      requiredSuggestions: []
